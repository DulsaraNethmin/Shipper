name: shipper
description: "Shipper — Australian road-transport marketplace, customer and provider in one app."

# Never published. This is an application, not a package.
publish_to: 'none'

# version+build. Docs/07 §8 requires every build to carry a unique, monotonically increasing
# build number and to report its version with each API call, so a crash can be attributed to
# one build. CI overrides both with --build-name and --build-number; this is the local default.
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # The client stack, decided in Docs/10 §8.3 and recorded in Docs/07 §9. Not a menu — these
  # are closed decisions, and a second state library or a second router is a defect.
  flutter_riverpod: ^3.4.2
  go_router: ^17.4.0
  dio: ^5.11.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # SHIP-48. Named by Docs/07 §3 rather than chosen here: the refresh token goes in the iOS
  # Keychain and the Android Keystore and nowhere else. The Android floor of API 24 in
  # android/app/build.gradle.kts exists for this package's requirement and for nothing else, so
  # the two move together or not at all.
  #
  # Held at 10.x deliberately. Version 11 compiles against Android SDK 37 and fails the debug
  # build against the 36 this project targets — and moving compileSdk is an Android-wide change
  # that also wants a newer Gradle plugin, which belongs with the signing work at SHIP-24…27
  # rather than inside a three-point storage ticket. 10.3.1 uses the same Keystore-wrapped
  # ciphers, needs API 23, and its options are the ones token_store.dart asserts on.
  flutter_secure_storage: ^10.3.1

  # SHIP-124. Named by Docs/10 §8.3 and Docs/07 §9 rather than chosen here: **Drift over SQLite**
  # for the offline queue and cached reads. The reason is transactional rather than about storage
  # — an operation, its idempotency key, the time the user acted and the path to its proof image
  # either all commit or none of them do, and the sync worker has to mark an item in flight and
  # recover cleanly when the process dies mid-upload. A key-value store expresses neither.
  #
  # `drift_flutter` is one method, `driftDatabase(name:)`, resolving the platform's
  # application-support directory. It is the alternative to depending on `path_provider` here and
  # writing the same five lines by hand.
  #
  # **The native footprint, since Docs/11 §9 raises exactly this about packages with native
  # integrations.** `sqlite3` 3.x carries a build hook that supplies libsqlite3 per platform;
  # `sqlite3_flutter_libs` and `sqlcipher_flutter_libs` resolve in the lockfile at `0.6.0+eol` and
  # `0.7.0+eol`, which are empty marker versions their author publishes so the superseded
  # Flutter-specific build scripts cannot be used alongside the hook. None of it reads a device
  # identifier, a contact, a location or an advertising id — so unlike `device_info_plus`, which
  # §9 declines for precisely that reason, neither the Apple privacy labels nor the Play
  # data-safety declaration moves. What is stored is the user's own operations, on their own
  # device, which the app already held in memory.
  drift: ^2.34.3
  drift_flutter: ^0.3.1

  # SHIP-168, and the two packages the launch-time version gate cannot be built without.
  #
  # `package_info_plus` reads the **native build number** — `CFBundleVersion` on iOS,
  # `versionCode` on Android — which is the integer `GET /v1/app/minimum-version` publishes a
  # floor against. Docs/07 §8 requires every build to carry one, and Flutter's tooling already
  # writes it: `ios/Runner/Info.plist` holds `$(FLUTTER_BUILD_NUMBER)` and
  # `android/app/build.gradle.kts` holds `flutter.versionCode`, both set by `--build-number`.
  #
  # **The alternative was a `--dart-define`, which needs no package at all**, and it was rejected
  # for one reason: it is a second place the build number lives, and nothing keeps the two in
  # step. The release pipeline at SHIP-24…27 would have to pass `--build-number=N` and a matching
  # define forever, and the first build that passes only one compares the wrong integer — locking
  # out a supported build, or admitting the exact build the floor was raised to retire, with no
  # test failure and no log line either way.
  #
  # `url_launcher` is what makes "linking to the store" a link rather than a printed URL.
  #
  # **The native footprint, since Docs/11 §9 raises this about packages with native
  # integrations.** Both are published by flutter.dev, and neither reads a device identifier, a
  # contact, a location or an advertising id — so unlike `device_info_plus`, which §9 declines for
  # precisely that reason, neither the Apple privacy labels nor the Play data-safety declaration
  # moves. `package_info_plus` reads this application's own bundle metadata; `url_launcher` opens
  # a URL. Both compile against `flutter.compileSdkVersion` with minSdk 19 and 24, so the API 24
  # floor this project holds for `flutter_secure_storage` does not move either — which was the
  # question worth asking, because that floor is the reason that package is pinned at 10.x.
  package_info_plus: ^10.2.1
  url_launcher: ^6.3.2
  # SHIP-130. Three packages for one *Done when*: "photo captured, compressed, queued, and **never
  # written to the photo library**." The last clause is what chose the first two, so the reasoning is
  # here rather than being reconstructed later from a version bump.
  #
  # ## `camera` and not `image_picker`, which is the one-line answer and the wrong one
  #
  # `ImagePicker().pickImage(source: ImageSource.camera)` needs no preview and no lifecycle. On
  # Android it hands the capture to whichever camera application the manufacturer shipped, through an
  # `ACTION_IMAGE_CAPTURE` intent — and several of those write a copy of every photograph into
  # `DCIM/Camera` regardless of the output the caller asked for. Nothing in Dart can prevent that or
  # even observe it, so the *Done when* would be true on iOS, false on some Android handsets, and
  # untestable on both. `camera` gives the application the capture surface — CameraX and
  # AVFoundation — and `takePicture()` writes into this app's own temporary directory, so nothing in
  # the path touches `MediaStore` or `PHPhotoLibrary`.
  #
  # **The store consequence, since Docs/11 §9 asks for it about anything with a native
  # integration.** Nothing new is *collected*: the app already uploads proof photographs (SHIP-114),
  # so "Photos and videos" was on the Play data-safety declaration and the Apple privacy labels
  # before this. What changes is one line each: `NSCameraUsageDescription` already exists (SHIP-179)
  # and Android's `CAMERA` permission is already declared, with `uses-feature required="false"` so
  # Play does not hide the app from handsets without one.
  #
  # **The one risk this ticket takes, named rather than absorbed.** The plugin's README asks for
  # `NSMicrophoneUsageDescription` beside the camera string. This build passes `enableAudio: false`,
  # so no microphone is ever opened, and neither string nor Android's `RECORD_AUDIO` is declared — a
  # purpose string for a microphone the app does not use is worse than its absence, to a reviewer and
  # to the person reading the prompt. `proof_never_reaches_the_gallery_test.dart` holds all three
  # facts together. If App Review ever asks for the string, that is the moment to add it, and the
  # test says where. CameraX needs minSdk 21, below this project's floor of 24, so the floor that
  # exists for `flutter_secure_storage` does not move.
  #
  # ## `image` and not `flutter_image_compress`, which is faster and cannot be tested here
  #
  # A native compressor is a method channel with nothing behind it in a host test, and the
  # *Done when*'s "compressed" clause would then be an assertion about a mock. `image` is pure Dart,
  # so `proof_image_test.dart` decodes and re-encodes real JPEGs on the host and measures the result
  # — including that the EXIF block, coordinates included, does not survive. It has **no native
  # footprint at all**, so unlike `camera` it moves neither store declaration.
  #
  # The cost is CPU: a full-resolution decode, resize and re-encode is hundreds of milliseconds. It
  # is bounded by capturing at 1080p rather than at the sensor's maximum, and it runs through
  # `Isolate.run` so the shutter never freezes. If field measurement shows it is still too slow,
  # `flutter_image_compress` is the swap and the seam is one function — `proofCompressorProvider`.
  #
  # ## `path_provider`, which is already in the lockfile
  #
  # A queued proof photograph may sit on the handset for hours, so it is written to
  # `getApplicationSupportDirectory()` and not to the cache directory, which the operating system may
  # purge — losing a driver's proof is exactly the silent drop Docs/07 §4 forbids. `drift_flutter`
  # already depends on this transitively and its pubspec note above says as much, so **no new native
  # code enters the build**; what changes is that the dependency is now declared by the package that
  # imports it, which `depend_on_referenced_packages` is right to insist on.
  camera: ^0.12.0+2
  image: ^4.9.1
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  # SHIP-48. `flutter test` runs on the host, where there is no Keychain and no Keystore, so
  # the tests under test/ can only prove that the right call was made with the right options.
  # integration_test runs the same Dart on a simulator against the real platform, which is the
  # difference between demonstrating the *Done when* line and asserting it. Not part of
  # `make flutter-check` — it needs a device, and the Flutter CI job is a Linux runner until
  # SHIP-24…SHIP-27.
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  freezed: ^3.2.0
  json_serializable: ^6.14.1

  # Already present transitively; declared because token_store_test.dart imports it, and
  # depend_on_referenced_packages is right that an undeclared import is a dependency nobody
  # decided on. It is the seam flutter_secure_storage routes every call through, so replacing
  # the instance is how a test observes what actually reached the Keychain or the Keystore —
  # SHIP-48's *Done when* is not otherwise demonstrable without a device.
  flutter_secure_storage_platform_interface: ^2.0.3

  # SHIP-124. Generates the `.g.dart` half of core/queue/queue_database.dart under the same
  # build_runner invocation freezed and json_serializable already use, so `make flutter-codegen`
  # covers it and SHIP-21's `git diff --exit-code` on the generated files covers it too.
  drift_dev: ^2.34.0

flutter:
  uses-material-design: true
