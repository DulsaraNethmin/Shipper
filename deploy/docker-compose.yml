# Local development stack: PostgreSQL, Redis, Kafka, object storage, mail catcher.
#
# This is a development convenience, not a deployment artefact. Production runs on managed
# AWS services (Docs/06 §2). Nothing here should acquire production responsibilities —
# if a setting matters in production, it belongs in infrastructure-as-code, not this file.
#
# Every service publishes its port to the host, because the Go service runs on the host
# during development (`make run`) while its dependencies run in containers.
#
#   make up      start everything and wait until healthy
#   make down    stop, keeping data
#   make reset   stop and destroy all data

name: shipper

services:
  # --- SHIP-2 -------------------------------------------------------------------------
  # System of record. Authoritative for every business decision (Docs/06 §4).
  postgres:
    image: postgres:17-alpine
    container_name: shipper-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shipper}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shipper}
      POSTGRES_DB: ${POSTGRES_DB:-shipper}
      # Deterministic collation. Left to the host locale, index ordering can differ
      # between machines, which is a genuinely unpleasant class of bug to chase.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # The dbname is given explicitly: pg_isready defaults to the username as the
      # database name, which passes before the real database finishes initialising.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shipper} -d ${POSTGRES_DB:-shipper}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # --- SHIP-3 -------------------------------------------------------------------------
  # Refresh-token state, device registry, idempotency keys, rate limits (Docs/06 §2.1).
  #
  # Redis must never hold the only copy of a job, bid, or status (Docs/06 §4). Persistence
  # is enabled here so a restart during development does not silently invalidate every
  # session, but that is a convenience — nothing may depend on it for correctness.
  redis:
    image: redis:7-alpine
    container_name: shipper-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # --- SHIP-4 -------------------------------------------------------------------------
  # Event backbone for notifications, reporting, and background processing (Docs/06 §2).
  # Single-node KRaft — no ZooKeeper. Combined broker and controller roles, which is
  # appropriate for development and never for production.
  #
  # Two listeners, and the distinction matters:
  #   PLAINTEXT      kafka:9092        for clients inside the compose network
  #   PLAINTEXT_HOST localhost:29092   for clients on the host, including `make run`
  #
  # A Kafka client connects once to bootstrap, then reconnects to whatever address the
  # broker advertises. Advertising only the internal name is the classic misconfiguration:
  # bootstrap succeeds from the host, then every subsequent call hangs trying to resolve
  # `kafka`. Hence the separate host listener.
  #
  # Note the empty hosts in KAFKA_LISTENERS (`PLAINTEXT://:9092`) rather than an explicit
  # `0.0.0.0`. Both bind every interface, but the CONTROLLER listener is not advertised,
  # so Kafka derives its advertised address from `listeners` — and a literal 0.0.0.0 there
  # fails validation outright with "advertised.listeners cannot use the nonroutable
  # meta-address". The empty host resolves to the canonical hostname instead.
  kafka:
    image: apache/kafka:3.9.0
    container_name: shipper-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      # Must match the mounted volume below. Left unset, Kafka writes to /tmp/kafka-logs
      # and the volume silently holds nothing — the log directory would then be discarded
      # on container recreation, taking the cluster's metadata with it.
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # Single broker: every replication factor must be 1 or topic creation blocks forever.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Off deliberately. The outbox publisher (SHIP-134) creates topics explicitly with a
      # versioned schema (SHIP-135); a typo in a topic name should fail loudly rather than
      # silently create a second topic that nothing consumes.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-5L6g3nShT-eMCtK--X86sw}
    ports:
      - "${KAFKA_PORT:-29092}:29092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s

  # --- SHIP-15p -----------------------------------------------------------------------
  # Object storage for proof-of-delivery photographs and provider verification documents
  # (Docs/06 §4.1, §5.2). MinIO speaks the S3 API, so the deployed implementation is the one
  # exercised locally — against real SigV4 pre-signed URLs rather than against a stub, which
  # is the same argument §4.1 makes for testing against a real PostgreSQL.
  #
  # It is here, in a prep ticket, rather than inside SHIP-114 which consumes it: a service in
  # this file, a published port, a bucket and an internal/config section are all shared
  # surfaces a domain branch may not edit (Docs/10 §9.2), and SHIP-114's "a client receives a
  # short-lived pre-signed URL and uploads directly" cannot be demonstrated without them.
  # Docs/11 §6 struck SHIP-114 for five consecutive waves for exactly this reason.
  #
  # Two ports, both published because the Go service runs on the host:
  #
  #   9000  the S3 API — what the service and every pre-signed URL talk to
  #   9001  the browser console — nothing depends on it, and it is what you want the first
  #         time an upload lands somewhere unexpected
  #
  # 9000 is a crowded port on a developer machine — Portainer, SonarQube and php-fpm all
  # want it — which is what MINIO_PORT is for. POSTGRES_PORT exists for the same reason.
  #
  # MINIO_REGION has to agree with what the client signs with. SigV4 puts the region in the
  # credential scope, so a mismatch is refused as SignatureDoesNotMatch — an error that says
  # nothing about the region being wrong. It is the same value as STORAGE_REGION for that
  # reason, and Sydney is where the deployed bucket will be.
  #
  # # The bucket is created by `make up`, not by an init container here
  #
  # The usual shape is a one-shot `mc` container with `depends_on: service_healthy`. It was
  # written, run, and rejected on two measured counts:
  #
  #   - `make up` is `docker compose up -d --wait`, and --wait fails when *any* service
  #     exits, including one that exits 0 having done its job: "container shipper-minio-init
  #     exited (0)", and `up` returns 1. Waiting for the stack is what `make up` is for.
  #   - The bucket is per-worktree (CLAUDE.md's worktree table) and this stack is shared,
  #     because COMPOSE_PROJECT_NAME is pinned so that it is. An init container runs when
  #     its container is created, so the first worktree to bring the stack up would create
  #     its own bucket and the next four would find nothing. The bucket has to be made on
  #     every `make up` in every tree, which is a make step and not a compose service.
  #
  # `mc` ships inside this image, so that step needs no second image and no second pull.
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: shipper-minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-shipper}
      # Eight characters is MinIO's own minimum, which is why this is not `shipper` twice
      # over the way the database credentials are.
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-shipperminio}
      MINIO_REGION: ${STORAGE_REGION:-ap-southeast-2}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      # curl is in the image, so this needs nothing the container does not already have.
      # /minio/health/live is the liveness probe MinIO documents; it answers 200 only once
      # the drive has been validated, which is the state `make up` is waiting for.
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # --- SHIP-200 -----------------------------------------------------------------------
  # The mail catcher. Every message the platform sends in development lands here instead of
  # in an inbox, and is read in a browser at http://localhost:8025.
  #
  # It exists because the alternative was reading a verification code out of the API log.
  # The console transport prints the whole body precisely so that was possible, and it works
  # — but it is the one step of the customer journey a person cannot walk the way a customer
  # walks it, and Docs/01 §8 now requires the whole of that journey to be drivable through
  # the product's own interfaces.
  #
  # No credential and no TLS, deliberately. This accepts anything on 1025, which is what
  # makes EMAIL_SMTP_ENCRYPTION=none and an empty username correct in deploy/.env.example.
  # A catcher that needed configuring to catch would defeat its purpose, and it holds nothing
  # worth protecting — mail that was never going to leave the machine.
  #
  # Storage is in-memory on purpose, so there is no volume below: a restarted catcher is an
  # empty mailbox, which is the right state for one whose entire contents are yesterday's
  # test registrations. Postgres, Redis and Kafka keep their volumes because losing their
  # data costs a `make migrate-up` or a re-seed; losing this costs nothing.
  mailpit:
    image: axllent/mailpit:v1.31.0
    container_name: shipper-mailpit
    restart: unless-stopped
    environment:
      # Accept any credential rather than requiring none, so a developer who copies a
      # username and password out of a staging configuration is not met with a refusal that
      # looks like the platform's fault.
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    ports:
      # Fixed rather than per-worktree, and that is the SHIP-200 clause rather than an
      # oversight. COMPOSE_PROJECT_NAME is pinned in the Makefile so every worktree shares
      # one stack; a catcher whose port varied would be a second thing each tree has to set,
      # and unlike STORAGE_BUCKET there is nothing here for two trees to collide over — a
      # mailbox read by a person is not asserted on by a test.
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      # Mailpit's own readiness subcommand, which is in the image and needs no shell, no
      # curl and no wget — the image is a scratch build carrying the one binary.
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  postgres-data:
  redis-data:
  kafka-data:
  minio-data:
