# SHIP-20 — build, vet, boundary lint and tests for the Go service.
#
# Path-filtered from the first workflow, as .github/workflows/README.md requires: macOS runners
# for iOS builds cost roughly ten times Linux minutes, and a Go-only change must not trigger
# one. The filter includes this file, because a workflow that ignores its own definition will
# not re-run when that definition is fixed.
#
# contracts/** is in the filter because SHIP-17a's tests read contracts/openapi.yaml and
# validate live handler responses against it. Without it, editing a contract fragment — which
# is how every domain will publish its endpoints — would not run the one test that checks the
# fragment against the service. It now also covers contracts/statuses.yaml, the one source
# SHIP-56a generates three languages from.
#
# apps/**/*.gen.dart and apps/**/*.gen.ts are the other half of that (SHIP-56a), and they are the
# only entries here naming a file outside services/core. The reason is where the staleness check
# lives: TestGeneratedFilesAreCurrent renders contracts/statuses.yaml and compares it with every
# committed output, the Dart and TypeScript ones included, and it is a Go test. Without these two
# globs, hand-editing a generated Dart file would start the Flutter workflow — which does not
# check it — and not this one, which does. SHIP-56a's criterion is "CI fails if a generated file
# is stale", and that either holds for all three languages or it holds for one.
#
# **This costs no macOS minutes and cannot.** Every job in every workflow here is ubuntu-latest;
# the iOS and Android builds that need a real runner are SHIP-24…27, blocked on X-2 and X-3. What
# .github/workflows/README.md forbids is a Go-only change starting a client pipeline, and that is
# unchanged: a change under services/core/ still starts this workflow alone. The globs are narrow
# on purpose — a hand-written Dart or TypeScript file matches neither, so ordinary client work
# does not start this job either.
name: Go

on:
  push:
    branches: ["**"]
    paths:
      - "services/core/**"
      - "contracts/**"
      - "apps/**/*.gen.dart"
      - "apps/**/*.gen.ts"
      - ".github/workflows/go.yml"
      - "Makefile"
      - "mk/**"
  pull_request:
    paths:
      - "services/core/**"
      - "contracts/**"
      - "apps/**/*.gen.dart"
      - "apps/**/*.gen.ts"
      - ".github/workflows/go.yml"
      - "Makefile"
      - "mk/**"

# A second push to the same branch supersedes the first. Cancelling saves minutes and, more
# usefully, stops a stale red run sitting next to a fresh green one.
concurrency:
  group: go-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: vet, boundaries, tests
    runs-on: ubuntu-latest

    # Both service containers are present because the alternative is worse than having no
    # tests at all. The integration tests skip themselves when their dependency is missing —
    # so without these, this job would pass having exercised none of the idempotency store,
    # none of the schema constraints, and none of the append-only audit trigger, and report
    # success. .github/workflows/README.md names the trap: "they pass by being skipped, which
    # reads as green." internal/testsupport now fails instead of skipping, which turns a
    # missing service into a loud failure rather than a quiet one.
    #
    # The object store is the third dependency and it is **not** here (SHIP-15p). The argument
    # above applies to it unchanged — a storage test written against a missing service turns this
    # job red rather than quietly green — but a service container cannot express it: the block
    # takes an image, environment, ports and `docker create` options and **no command**, while
    # minio/minio's default command prints its usage and exits. It is started by a step instead,
    # from the same pinned release development runs. See "object storage" below.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: shipper
          POSTGRES_PASSWORD: shipper
          POSTGRES_DB: shipper
          # Matches deploy/docker-compose.yml. Collation affects index ordering, and a
          # test that sorts differently here than locally is a genuinely horrible bug to
          # track down.
          POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shipper -d shipper"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: services/core/go.mod
          cache-dependency-path: services/core/go.sum

      # The object store (SHIP-15p), started here rather than in `services:` above for the
      # reason that block's comment gives: a service container cannot be given a command, and
      # this image needs one.
      #
      # Two images could have gone in the block instead, and both are worse than a step.
      # minio/minio:edge-cicd carries `server /data` as its command and is an unreleased build
      # frozen in 2021; bitnami/minio starts a server unprompted and creates a bucket from an
      # environment variable, and its public repository was retired in 2025. Either would mean CI
      # exercising a different object store from the one `make up` runs, which is the drift this
      # repository avoids everywhere else — the compose stack and this workflow already run the
      # same PostgreSQL and the same Redis.
      #
      # The bucket is made here for the reason the Makefile makes it rather than compose: `mc`
      # ships inside the image, so it needs no second image and no second pull. Every value below
      # matches deploy/docker-compose.yml and internal/config's development defaults, the way this
      # file's POSTGRES_* already match deploy/.env.example — nothing sets STORAGE_* for the
      # tests, because the defaults are these.
      - name: object storage
        env:
          MINIO_IMAGE: minio/minio:RELEASE.2025-09-07T16-13-09Z
        run: |
          docker run -d --name shipper-minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=shipper \
            -e MINIO_ROOT_PASSWORD=shipperminio \
            -e MINIO_REGION=ap-southeast-2 \
            "$MINIO_IMAGE" server /data
          for _ in $(seq 1 60); do
            curl -fsS http://localhost:9000/minio/health/live >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://localhost:9000/minio/health/live >/dev/null || {
            echo "::error::the object store did not become live"
            docker logs shipper-minio
            exit 1
          }
          docker exec shipper-minio sh -c '
            set -e
            mc alias set local http://127.0.0.1:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" >/dev/null
            mc mb --ignore-existing local/shipper-dev >/dev/null
            mc anonymous set none local/shipper-dev >/dev/null'
          echo "bucket shipper-dev exists and has no public read path"

      # `make check` rather than a list of steps. It is already vet + the SHIP-11 boundary
      # lint + `go test -race`, and a workflow that reimplements that list drifts from it —
      # the boundary lint would end up enforced locally and not here, which is the one place
      # it has to hold.
      - name: make check
        run: make check

      # An unauthorised dependency fails the build. Docs/10 §9.2 makes adding a module a
      # deliberate act: two branches that each add a different one produce a go.mod conflict
      # and a go.sum conflict, and the second must never be resolved by hand.
      - name: go.mod is tidy
        run: |
          cd services/core
          go mod tidy
          git diff --exit-code go.mod go.sum || {
            echo "::error::go.mod or go.sum is not tidy. Run 'make tidy' and commit the result."
            exit 1
          }

      - name: Australian English
        run: ./scripts/check-spelling.sh

  migrations:
    name: up, down, up
    runs-on: ubuntu-latest

    # Reserved number blocks stop two branches claiming the same migration *number*. They do
    # nothing about two migrations that both alter the same table: those merge cleanly, because
    # the files differ, and fail only when applied. This job is where that fails — on every
    # pull request, against an empty database, rather than on somebody's machine after review.
    #
    # The round trip also proves each down migration actually reverses its up. A missing or
    # wrong down is invisible until a rollback, which is the worst moment to discover it.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: shipper
          POSTGRES_PASSWORD: shipper
          POSTGRES_DB: shipper
          POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shipper -d shipper"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: services/core/go.mod
          cache-dependency-path: services/core/go.sum

      - name: apply every migration
        run: make migrate-up

      - name: reverse every migration
        run: make migrate-down n=all

      - name: the database is empty again
        run: |
          remaining=$(psql "postgres://shipper:shipper@localhost:5432/shipper?sslmode=disable" \
            -tAc "SELECT count(*) FROM information_schema.tables
                  WHERE table_schema = 'public' AND table_name <> 'schema_migrations'")
          if [ "$remaining" != "0" ]; then
            echo "::error::$remaining table(s) survived 'migrate down all'; a down migration does not reverse its up."
            psql "postgres://shipper:shipper@localhost:5432/shipper?sslmode=disable" \
              -c "\dt" || true
            exit 1
          fi

      - name: apply every migration again
        run: make migrate-up
