components:
  schemas:
    Error:
      $ref: './components/schemas/error.yaml#/Error'
    FieldError:
      $ref: './components/schemas/error.yaml#/FieldError'

  headers:
    RequestID:
      description: |
        The request identifier, echoed on every response. It is also in the body of every
        error, because a user reporting a problem sends a screenshot and a header does not
        survive one (SHIP-14, SHIP-174).
      schema:
        type: string
      example: 01J8XV3M9K7QW2ZR4T6Y8N0P1C

  securitySchemes:
    BearerAccessToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        The mobile access token (SHIP-37, SHIP-44). HS256, fifteen minutes, obtained from
        `/v1/auth/login` and rotated through `/v1/auth/refresh`.

        **The driver portal's token is a different system and is never accepted here.** It
        carries its own audience and its own key material, and neither can be exchanged for the
        other (`Docs/10` §5).

    BearerAdminSession:
      type: http
      scheme: bearer
      description: |
        The administrator console session (SHIP-147). **Not a JWT** — an opaque random value,
        stored hashed against `admin_sessions` and read back on every request.

        That shape is a deliberate departure from the other two, and it buys two things a signed
        token cannot: an administrator can be signed out and stop being able to act *at once*, and
        a role change takes effect on the next request rather than at the next expiry (`Docs/04`
        §9's least-privilege requirement, and SHIP-148's permissions).

        It is obtained from `POST /v1/admin/sessions` and ended by
        `DELETE /v1/admin/sessions/current`. There is no refresh: the session slides while the
        console is in use and stops after thirty minutes idle or twelve hours in total, whichever
        comes first.

        **It is a third credential system, and it cannot be exchanged with either of the others.**
        A mobile access token on an operation secured with this answers `401`; this on an operation
        secured with `BearerAccessToken` answers `401` as well. Neither verifier will look at the
        other's credential — one parses a signed JWT and the other looks up a digest — so the
        separation is a property of the construction rather than a rule somebody follows.

    BearerDriverToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        The driver's job-scoped link (SHIP-107, SHIP-108). HS256 under **its own signing keys**,
        `aud=shipper-driver`, seven days, and it names exactly one job.

        It is issued by `POST /v1/jobs/{id}/driver` and obtainable nowhere else — the awarded
        provider forwards it, because Shipper sends no SMS in the MVP (`Docs/01` §4.5). There is no
        refresh and no account behind it: a driver has neither, so this is the whole of their
        access, and when it expires the provider issues another.

        **It grants one job and nothing else.** Presenting it on any other job answers `404`, the
        same as a job that does not exist. Presenting it on an operation secured with
        `BearerAccessToken` answers `401`, and presenting a mobile access token here answers `401`
        too — the two systems cannot be exchanged in either direction (`Docs/10` §5).

  responses:
    BadRequest:
      description: The request was malformed, or failed validation.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthenticated:
      description: |
        No usable credential was presented (SHIP-44). Carries a `WWW-Authenticate: Bearer`
        challenge, as RFC 9110 requires.

        **Branch on `error.code`, not on the status.** `token_expired` means the credential was
        genuine and has lapsed: refresh it and retry, and do not sign the user out.
        `unauthenticated` means there was no usable credential at all — signing in again is the
        only way forward.

        A failure is deliberately not explained further. Which check refused a credential is
        information only somebody probing has a use for.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestID'
        WWW-Authenticate:
          description: The authentication scheme this endpoint accepts.
          schema:
            type: string
          example: Bearer error="invalid_token"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: |
        No such resource — or the caller has no business knowing whether it exists. The two
        are deliberately indistinguishable wherever telling them apart would confirm the
        existence of something private.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    MethodNotAllowed:
      description: The path exists but does not serve this method.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: |
        A failure the caller cannot act on. Carries no detail beyond the request ID, which is
        the thing that makes it diagnosable.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
