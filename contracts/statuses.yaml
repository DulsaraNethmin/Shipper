# The status enumerations, in one place, for three languages (SHIP-56a).
#
# Docs/10 §8.2 names this file: "contracts/statuses.yaml is the source; make codegen produces
# the Go, Dart and TypeScript forms; the generated files are committed and CI asserts that a
# regeneration changes nothing." Docs/08 gives the reason one repository holds all three —
# "twelve statuses expressed in three languages" — and generation is what makes that hold
# rather than merely intend it.
#
# ## What belongs here, and what deliberately does not
#
# **An enumeration belongs here when more than one language has to know it.** That is the whole
# test. The three below are each written down in Go, in Dart and — from this ticket — in
# TypeScript, and before this file existed each was three hand-written lists that could only be
# compared by opening them side by side.
#
# **Behaviour does not belong here, and the line is drawn at "would a second language want a
# copy of it?"** The transition table of Docs/02 §2 lives in internal/jobs and nowhere else,
# because Docs/07 §3 forbids the device deciding anything: the app asks the platform what is
# permitted, so a generated copy of the table on the phone would be a second authority for a
# question that has exactly one. Bidding's live() predicate is the same argument. Generating
# either would be generating a decision, not a vocabulary.
#
# **Actor vocabularies are not statuses and are not here.** jobs.ActorType, bidding.Party and
# Dart's BidParty name a kind of person rather than a lifecycle state. They are held to their
# own CHECK constraints by their own tests and stayed hand-written, because this ticket is
# scoped to status enumerations. Nothing stops a later ticket moving them: it is an entry in
# this file and no new mechanism.
#
# ## Two forms per value, both written out, neither derived
#
# `stored` is what the database holds and what the CHECK constraint names. `wire` is what a
# client sees, lower snake case per Docs/10 §4.7.
#
# Go used to derive the second from the first by lower-casing and replacing spaces, and argued
# for it: "a transformation cannot disagree with its input", where a hand-written table beside
# the constants can. That argument was right about hand-written tables and does not survive
# generation — a table produced from the same source as the constants cannot disagree with them
# either. What it cost was visibility. Both strings are published contracts with different
# audiences: `stored` is what ck_jobs_status holds and what an operator reads in a database, and
# `wire` is what a build already installed on somebody's phone branches on. A derivation hides
# the second behind a rule, and the first status that did not fit the rule would be renamed on
# the wire by a change nobody read as a rename.
#
# ## The identifiers are derived, because they are not contracts
#
# `wire` gives every language its identifier: driver_assigned becomes Go's StatusDriverAssigned,
# Dart's driverAssigned and TypeScript's DriverAssigned. Nobody outside this repository can see
# them, so there is nothing to hold stable and no reason to write them down three times.
#
# ## Documentation is part of the source
#
# Every enumeration and every value carries `doc`, and the generator refuses a spec where one is
# missing. It is rendered into all three languages, which is the point: the reasoning behind
# StatusCountered — that Docs/02 §4 describes it and Superseded as the same transition seen from
# its two ends, and that the platform writes only the second — used to exist in Go and in Dart as
# two paragraphs somebody had written twice.
#
# `{{n}}` in any doc renders as the number of values, spelled out. Prose that says "one of the
# twelve" is a hand-maintained scalar of exactly the kind Docs/11 §3 records four consecutive
# merges getting wrong, and this file is the last place that should carry one.

version: 1

# TypeScript is one module rather than one per enumeration, because it has no equivalent of a Go
# package or a Flutter feature folder to put them in — and because the driver portal is a single
# surface that will read a job status, a bid status and a proof exception reason on one screen.
#
# One module **per surface**, and SHIP-188b is the ticket that made it two. SHIP-56a wrote this
# block saying "a second output is one line in this file when the admin panel grows a screen that
# needs one", and the admin panel has now grown three: the job search filters on a status, the job
# detail renders one beside a list of bid statuses, and both take the *stored* form because that is
# what GET /v1/admin/jobs both accepts and returns. Without this line the panel would carry a
# hand-written copy of twelve strings — which is the exact duplication this file was created to end,
# and would be the third copy rather than the first.
#
# **It stayed one line, and the generator gained a list rather than the panel gaining a package.**
# pnpm-workspace.yaml anticipated the two surfaces "eventually sharing the same status
# enumeration" and a workspace package is the obvious way to do it. It was refused: @shipper/statuses
# would buy a build step, a version to keep in step and an entry in two package.json files, in
# exchange for deleting a generated file nobody edits. Both surfaces run their tests as `node --test`
# over TypeScript directly, with no build, and a workspace package is the first thing that would end
# that.
#
# **Two copies cannot disagree**, which is the property that makes copying acceptable here and would
# not make a hand-written second copy acceptable: TestGeneratedFilesAreCurrent renders this
# specification and compares every path, so an edit to one file and not the other fails `make check`.
typescript:
  files:
    - apps/driver-portal/lib/statuses.gen.ts
    - apps/admin/lib/statuses.gen.ts

enums:
  - name: job_status
    authority: Docs/02 §1
    constraint: ck_jobs_status
    go:
      file: services/core/internal/jobs/status_gen.go
      package: jobs
      type: Status
      prefix: Status
      slice: Statuses
    dart:
      file: apps/mobile/lib/features/jobs/job_status.gen.dart
      type: JobStatus
    typescript:
      type: JobStatus
    doc: |
      one of the {{n}} job states in Docs/02 §1, which is authoritative for the names.

      The stored form is that document's own string, spaces and sentence case included, because
      Docs/10 §3.4 requires it. The wire form is lower snake case, because Docs/10 §4.7 puts
      every enumeration on the wire that way even where the stored form has spaces — so
      "En route to pickup" reaches a client as en_route_to_pickup.

      Status is never a settable field. Every transition passes one guarded server-side function
      (Docs/02 §2, CLAUDE.md), and no request body in this API carries a status: one that arrived
      would be refused as an unknown field rather than quietly ignored. The values below are
      read, compared and displayed. They are not a way to assign one.

      Which moves are legal is deliberately not generated. Docs/02 §2's transition table lives in
      internal/jobs and nowhere else, because Docs/07 §3 forbids the device deciding anything —
      the app asks the platform what is permitted, and a copy of the table on the phone would be
      a second authority for a question that has one.
    values:
      - stored: Draft
        wire: draft
        doc: |
          a job the customer is still preparing; not visible to providers.
      - stored: Open
        wire: open
        doc: |
          a job that is published and eligible for bids.
      - stored: Negotiating
        wire: negotiating
        doc: |
          a job with one or more active bids or counter-offers, still open to eligible bids.

          Docs/02 §1 calls this a useful presentation status rather than a closed one: technically
          the job is still available unless the customer closes it or awards a bid.
      - stored: Awarded
        wire: awarded
        doc: |
          a job whose customer has accepted one provider bid; a provider commitment exists.
      - stored: Driver assigned
        wire: driver_assigned
        doc: |
          a job whose provider has nominated a driver, or self-assigned.

          Skippable. Docs/02 §2 permits Awarded straight to En route to pickup, because a provider
          driving the job themselves has nobody to nominate.
      - stored: En route to pickup
        wire: en_route_to_pickup
        doc: |
          a driver travelling to the pickup.
      - stored: Picked up
        wire: picked_up
        doc: |
          goods collected, confirmed by the provider.

          From here Docs/02 §6.2 makes cancellation a support case rather than a state change:
          once the goods are in somebody's vehicle the route out is Disputed, and an administrator
          resolving it.
      - stored: In transit
        wire: in_transit
        doc: |
          goods being transported.

          Docs/02 §2 allows the platform to apply this as a presentation change rather than an
          actor recording it.
      - stored: Delivered
        wire: delivered
        doc: |
          a successful delivery recorded by the provider, with its proof.

          Docs/01 §4.4 requires photo proof or a recorded exception reason, never neither — see
          the proof exception reasons in this same file.
      - stored: Completed
        wire: completed
        doc: |
          a job the customer has confirmed, or whose confirmation window expired without dispute
          (Docs/02 §6.1).

          Terminal. Docs/02 §2 offers no move out of it.
      - stored: Cancelled
        wire: cancelled
        doc: |
          a job that ended before completion.

          Terminal. Docs/02 §2 offers no move out of it.
      - stored: Disputed
        wire: disputed
        doc: |
          a job with an unresolved issue raised by a customer, provider or administrator.

          It freezes automatic completion until an administrator resolves it, to Completed or to
          Cancelled (Docs/02 §3).

  - name: bid_status
    authority: Docs/02 §4
    constraint: ck_bids_status
    go:
      file: services/core/internal/bidding/status_gen.go
      package: bidding
      type: Status
      prefix: Status
      slice: Statuses
    dart:
      file: apps/mobile/lib/features/bidding/bid_status.gen.dart
      type: BidStatus
    typescript:
      type: BidStatus
    doc: |
      one of the {{n}} bid states in Docs/02 §4, which is authoritative for the names.

      These {{n}} happen to be single words in sentence case, unlike the job statuses, so storing
      them unaltered looks like it costs nothing. It is the same rule all the same: the document
      is the source, and the moment somebody lower-cases one of them the pairing test against
      ck_bids_status is what says so.

      Whether an offer is still open for either party to act on is deliberately not generated.
      That predicate is internal/bidding's, for the reason the job transition table is
      internal/jobs': Docs/07 §3 puts every such decision on the platform, and what a client shows
      is presentation rather than authority.
    values:
      - stored: Draft
        wire: draft
        doc: |
          an offer the provider is composing and nobody else can see.

          Nothing a client can obtain: there is no endpoint that creates one and none that returns
          one. It is here because Docs/02 §4 enumerates it.
      - stored: Submitted
        wire: submitted
        doc: |
          a live offer awaiting the other party.

          What placing an offer produces, and where revising it leaves the offer. The only status
          this platform treats as live.
      - stored: Countered
        wire: countered
        doc: |
          an offer that has been answered with a different price or timing.

          A retained synonym for Superseded, which is the one the platform writes. That is now
          Docs/02 §4's own position rather than an implementation decision waiting for one.

          SHIP-87 chose it deliberately rather than by omission. Docs/02 §4 lists Countered beside
          Superseded and describes the two in almost the same words — one offer "answered with a
          different price or timing", the other "displaced by a counter from either party" — which
          are the same event seen from its two ends. A platform writing both would be writing two
          statuses for one transition, and would then have to say which of them a client branches
          on.

          Superseded is the one written, for a reason outside this vocabulary: the bid-closed error
          code and the BidNoLongerYours response in contracts/paths/bidding.yaml have both
          enumerated "rejected, expired, superseded" as the closed statuses since SHIP-85, and
          neither names Countered. The published contract had already made the choice.

          SHIP-96 closed the question from the other side, which is what turned a report into a
          decision. Rendering the offer chain to its three audiences, nothing acts on the
          distinction — so the alternative, giving the two statuses a difference they are actually
          for, would have cost a ticket to produce a value no audience reads.

          It stays in the list because Docs/02 §4 has it and Docs/10 §3.4 pairs the list with
          ck_bids_status in both directions — and because a value omitted from a client's enum
          decodes as unknown the day somebody starts writing it. The trigger for writing it would
          be a ticket needing to distinguish "displaced because the other party answered" from some
          other way of being displaced. There is no other way today.
      - stored: Accepted
        wire: accepted
        doc: |
          the awarded offer.

          At most one bid per job may hold it, and that is a database guarantee rather than an
          application one — a partial unique index in migration 000500, not a check in a handler.
      - stored: Rejected
        wire: rejected
        doc: |
          an offer the customer declined, including every competing bid closed by an award.
      - stored: Withdrawn
        wire: withdrawn
        doc: |
          an offer the party who made it took back, before it was accepted.
      - stored: Expired
        wire: expired
        doc: |
          an offer that ran out on its own terms.
      - stored: Superseded
        wire: superseded
        doc: |
          an offer displaced by a counter from either party.

          The row remains, because Docs/02 §4 keeps the whole chain readable to the customer, the
          bidding provider and administrators. It can be neither changed nor answered afterwards,
          only read.

  - name: proof_exception_reason
    authority: Docs/01 §4.4
    constraint: ck_proofs_exception_reason
    go:
      file: services/core/internal/delivery/proofexception_gen.go
      package: delivery
      type: ProofExceptionReason
      prefix: Exception
      slice: ProofExceptionReasons
    dart:
      file: apps/mobile/lib/features/delivery/proof_exception_reason.gen.dart
      type: ProofExceptionReason
    typescript:
      type: ProofExceptionReason
    doc: |
      why a recorded milestone carries no photograph.

      A closed list, and Docs/01 §4.4 wrote it. The {{n}} below are that paragraph's own {{n}},
      and there is deliberately no "other": a reason nobody can group is a moderation queue nobody
      can triage (Docs/04 §5). A driver's own words are not lost by leaving it out — the
      milestone's reason field is optional, 500 characters and one row away, so "the recipient
      asked me not to photograph their door" goes there beside a selected reason rather than
      instead of one.

      The exception is not a hole in the rule; it is the other half of it. Docs/01 §4.4 makes photo
      proof mandatory and, in the same paragraph, makes the exception path part of the same feature
      — because what must never happen is a driver standing at a delivery point unable to finish
      the job. An exception is evidence rather than the absence of it: a reason chosen from this
      list, recorded in the same transaction and the same table as the photographs.

      The stored form is the wire form here, and that is not an oversight. Job and bid statuses
      store Docs/02's exact strings because a document fixes them; no document fixes these, so a
      second spelling would be a translation table with nothing on the other side of it.
    values:
      - stored: recipient_objected
        wire: recipient_objected
        doc: |
          Docs/01 §4.4's first: the recipient objects to being photographed.

          Listed first because it is the one a driver meets most often.
      - stored: camera_unavailable
        wire: camera_unavailable
        doc: |
          its second: the camera permission is denied or the hardware is unavailable.

          This is the one a denied-permission flow offers instead of a dead end.
      - stored: location_unsafe
        wire: location_unsafe
        doc: |
          its third: the delivery point is unlit or unsafe to photograph.

          Listed last because it is the one a driver meets in the dark.
