# Admin — support, moderation, disputes and the audit trail.
#
# The counterpart of cmd/api/routes_admin.go. Docs/10 §8.1 keeps the two in step: a domain adds one
# route file and one fragment, and edits neither this file's siblings nor the middle of a shared
# document. The one shared line per path is its $ref in contracts/openapi.yaml.
#
# Response schemas are `additionalProperties: false` throughout. Docs/07 §6 requires *clients* to
# tolerate fields they do not recognise, which is a rule about client behaviour and not a licence for
# the contract to describe less than the service returns.
#
# # The one operation here today is called by a customer or a provider, not by an administrator
#
# Worth stating first, because the domain's name invites the opposite assumption. Docs/04 §7 has
# three stages — intake, investigation, outcome — and only the first belongs to the parties. Intake
# takes the ordinary mobile access token and is somebody reporting that their own delivery went
# wrong.
#
# Administrator sign-in is a separate system that a user token can never reach (SHIP-147), and the
# administrative stages arrive with it at SHIP-164. Nothing in this fragment can be reached with an
# administrator's credential, and nothing an administrator writes appears in any shape below —
# internal notes (SHIP-162) are never user-visible, and every field here is read straight back to the
# complainant.
#
# # There is no field for whose job and none for who is complaining
#
# The job is named in the path and the complainant is whoever the token says is calling. Which side
# of the job they were on is resolved by the platform from the job and its accepted bid; a
# `complainant` in a request body would be an authorisation decision made from client input, which
# Docs/07 §3 puts on the platform.

Disputes:
  post:
    operationId: raiseDispute
    summary: Raise a dispute about a job
    tags: [Disputes]
    security:
      - BearerAccessToken: []
    description: |
      Records what went wrong on a delivery and freezes the job while it is looked at (SHIP-163).
      This is the intake stage of Docs/04 §7.

      Only a party to the job may call it: the customer who owns it, or the provider whose bid was
      accepted. Everybody else — a provider who bid and lost, a customer looking at somebody else's
      job, an account with no connection to it at all — gets the same `404` a job that does not
      exist gets. Which jobs exist, who won them, and what is going wrong on them is commercial
      information nobody published.

      ## Raising a dispute freezes the job

      The job moves to `disputed` in the same transaction, which is what stops the 72-hour
      auto-complete running through the middle of an unresolved complaint (Docs/02 §3, §6.1). It is
      the only thing that does: there is no separate "pause" and no client-side hold.

      A dispute can therefore only be raised while there is a delivery to dispute — from `awarded`
      through `delivered`. A job still open for bids is cancelled rather than disputed, and a job
      that has completed or been cancelled has left the lifecycle; both answer
      `admin_job_not_disputable`.

      The job is unfrozen by an administrator resolving the dispute, which is not yet built.

      ## What to send

      ```json
      {
        "category": "goods_damaged_or_missing",
        "description": "Two of the four crates arrived with the sides staved in.",
        "desired_outcome": "A record of the damage, and the provider contacted about it.",
        "occurred_at": "2026-08-11T15:40:00Z",
        "evidence": ["Photographed the crates at the depot", "The driver's message of 11/08"]
      }
      ```

      **`occurred_at` is when the problem happened, not when you are reporting it**, and it is
      required for that reason. The platform records the filing time itself; if this defaulted, a
      complaint filed on Thursday about Tuesday's delivery would be stored as having happened on
      Thursday, and nothing afterwards could tell that value from one somebody meant. Send the
      incident's time even when it is the same as now.

      A time in the past is accepted however far back it goes. A time in the future is refused.

      ## One open dispute per job

      A job is frozen once. While a dispute is waiting on an outcome, a second one — including one
      raised by the *other* party to the same delivery — is refused with `admin_dispute_already_open`
      rather than queued behind it. Once it is resolved the job can be disputed again, so a job may
      accumulate disputes over its life while never having two open at once.

      ## Retrying

      **A retry** reuses its `Idempotency-Key`. It answers `200` with the dispute the first attempt
      raised, and writes nothing — whether the retry arrives a second later or a day later, because
      the guarantee is a unique index in the database rather than a cached response. Retry as often
      as a dropped connection requires.

      Reusing one key for a *different* complaint is refused with `idempotency_key_reused`. One key
      per action.
    parameters:
      - $ref: '#/JobID'
      - $ref: '#/IdempotencyKey'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/DisputeIntake'
    responses:
      '201':
        description: |
          The dispute is recorded and the job is now `disputed`.
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestID'
        content:
          application/json:
            schema:
              $ref: '#/Dispute'
      '200':
        description: |
          This `Idempotency-Key` had already raised this dispute. Nothing was written and the
          original is returned — the same shape as `201`, so a client that does not care which
          happened parses one type.
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestID'
        content:
          application/json:
            schema:
              $ref: '#/Dispute'
      '400':
        $ref: '../openapi.yaml#/components/responses/BadRequest'
      '401':
        $ref: '../openapi.yaml#/components/responses/Unauthenticated'
      '404':
        $ref: '../openapi.yaml#/components/responses/NotFound'
      '409':
        description: |
          One of four, and they lead to four different places:

          | `error.code` | What happened |
          |---|---|
          | `admin_job_not_disputable` | The job has not been awarded yet, or has already completed or been cancelled. Reload it |
          | `admin_dispute_already_open` | Somebody has already raised a dispute on this job and it is waiting on an outcome. Show that one |
          | `idempotency_key_reused` | This key already raised a *different* dispute on this job. Generate a new one |
          | `idempotency_request_in_progress` | An identical request is still being handled. Retry in a moment |
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestID'
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Error'
      '422':
        description: |
          One or more fields were rejected (`validation_failed`). `error.details` carries one entry
          per field, with the JSON path the client sent — including `evidence.0` for the offending
          entry in the list.
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestID'
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Error'
      '500':
        $ref: '../openapi.yaml#/components/responses/InternalError'
      '503':
        description: |
          A dependency this request needs is not answering (`service_unavailable`).
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestID'
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Error'

# --- schemas ---------------------------------------------------------------------------------

DisputeIntake:
  type: object
  additionalProperties: false
  required: [category, description, desired_outcome, occurred_at]
  description: |
    Docs/04 §7's intake fields, minus the two the platform supplies. The job is in the path and the
    complainant is the token. Unknown fields are refused, so a client typo fails loudly rather than
    being silently ignored.
  properties:
    category:
      type: string
      enum:
        - provider_fails_to_arrive
        - goods_differ_from_listing
        - customer_unavailable
        - delivery_is_late
        - goods_damaged_or_missing
        - other
      description: |
        What the dispute is about. The list is derived from Docs/02 §5's exception scenarios — the
        things that actually go wrong on a delivery — with `other` for everything nobody
        anticipated. Filing under `other` with a good description is better than filing under the
        nearest wrong heading; an administrator triages from this field.
      example: goods_damaged_or_missing
    description:
      type: string
      minLength: 1
      maxLength: 4000
      description: |
        What happened, in your own words. Generous in length because this is somebody describing an
        incident that may have cost them a day, not a note attached to a milestone.
      example: Two of the four crates arrived with the sides staved in.
    desired_outcome:
      type: string
      minLength: 1
      maxLength: 1000
      description: |
        What you want done about it. Shipper records outcomes and supports resolution; for the MVP
        it does not promise compensation or adjudicate liability (Docs/04 §7), so this is what the
        administrator works towards rather than what they are obliged to deliver.
      example: A record of the damage, and the provider contacted about it.
    occurred_at:
      type: string
      format: date-time
      description: |
        RFC 3339. **When the problem happened**, not when you are reporting it — the platform
        records the filing time itself, and the two are frequently days apart.

        Required. A default would put the report's time in the incident's field on every request
        that omitted it, and nothing afterwards could tell that value from one somebody meant.

        Not bounded backwards: a complaint about a delivery a month ago is still a complaint. A time
        in the future is refused.
      example: '2026-08-11T15:40:00Z'
    evidence:
      type: array
      maxItems: 20
      items:
        type: string
        minLength: 1
        maxLength: 500
      description: |
        What you have that supports this, described in your own words — "photographed the crates at
        the depot", "the driver's message of 11/08".

        **These are references, not uploads.** Attaching a file is not built: verification evidence
        and delivery proof both upload to private object storage through short-lived pre-signed URLs
        (Docs/04 §3.1), and neither path exists yet. The platform stores what you write here and
        does not resolve it. When uploads arrive they will be attachments alongside this list rather
        than a change to it.

        Optional, and an empty list is the same as omitting it.
      example:
        - Photographed the crates at the depot
        - The driver's message of 11/08

Dispute:
  type: object
  additionalProperties: false
  required:
    [id, job_id, raised_by, category, description, desired_outcome, evidence, occurred_at, raised_at]
  description: |
    One dispute, as its complainant sees it.

    **The job's status is deliberately not here.** A successful response means the job is `disputed`
    and nothing else; repeating the status would be a second copy of a vocabulary the jobs endpoints
    own.

    **Nothing an administrator writes appears here, and nothing ever will.** Internal support notes
    are never user-visible (SHIP-162), and the administrative view of a dispute is a shape of its own
    rather than this one reached by another route.
  properties:
    id:
      type: string
      format: uuid
      description: The dispute's identifier, and what the administrative workflow refers to it by.
      example: 0198f2c1-6b40-7a11-9c3e-2f9a4d51b7e3
    job_id:
      type: string
      format: uuid
      example: 0198f2c1-6b40-7a11-9c3e-2f9a4d51b7e1
    raised_by:
      type: string
      enum: [customer, provider]
      description: |
        Which side of the job the platform decided you were on, not who you are. It is resolved from
        the job and its accepted bid rather than from the role on your account — being the customer
        who owns *this* job is a different fact from having a customer account.
      example: customer
    category:
      type: string
      enum:
        - provider_fails_to_arrive
        - goods_differ_from_listing
        - customer_unavailable
        - delivery_is_late
        - goods_damaged_or_missing
        - other
      example: goods_damaged_or_missing
    description:
      type: string
      example: Two of the four crates arrived with the sides staved in.
    desired_outcome:
      type: string
      example: A record of the damage, and the provider contacted about it.
    evidence:
      type: array
      items:
        type: string
      description: |
        What was described at intake, in the order it was sent. Always present; an empty list rather
        than `null` when nothing was described.
      example:
        - Photographed the crates at the depot
    occurred_at:
      type: string
      format: date-time
      description: |
        When the complainant says the problem happened, in UTC. Exactly what was sent, uncorrected.
      example: '2026-08-11T15:40:00.000Z'
    raised_at:
      type: string
      format: date-time
      description: |
        When the platform received the report, in UTC, on the platform's clock. A client that
        renders only this is showing a filing time as though it were the incident.
      example: '2026-08-13T02:15:30.000Z'

# --- parameters ------------------------------------------------------------------------------

JobID:
  name: id
  in: path
  required: true
  description: The job's identifier.
  schema:
    type: string
    format: uuid
  example: 0198f2c1-6b40-7a11-9c3e-2f9a4d51b7e1

IdempotencyKey:
  name: Idempotency-Key
  in: header
  required: true
  description: |
    A client-generated value, one per action, reused for every retry of that action. Every
    state-changing request carries one and is refused without it (SHIP-15) — a phone that retries
    after a dropped connection must not raise the same complaint twice.
  schema:
    type: string
    maxLength: 255
  example: 6c1f2ab4-6f2a-4f0c-8b0e-9a53c1f21b8d

# --- administrator authentication (SHIP-147) ---------------------------------------------------
#
# Everything above this line is called by a customer or a provider. Everything below it is called
# by an administrator, with a credential the mobile system cannot produce and cannot verify.
#
# **The credential is `BearerAdminSession` and it is not a JWT.** The reasoning is on the scheme
# itself in openapi.yaml: it is a row rather than a signature, so a sign-out and a role change both
# take effect on the next request. What that costs a client is nothing — it is a bearer token in the
# ordinary header — and what it buys is that "this administrator has been stood down" is true
# immediately.

AdminSessions:
  post:
    operationId: adminSignIn
    summary: Sign in to the administration console
    tags: [Administration]
    security: []
    description: |
      Exchanges an administrator's email address and password for a console session (SHIP-147).

      **This is a different account system from `/v1/auth/login`.** An administrator has no `users`
      row, no mobile session and no role from the customer/provider vocabulary; a person who is both
      an administrator and a marketplace user has two accounts with two passwords, and neither
      credential can be used where the other belongs.

      ## What you get back

      ```json
      {
        "token": "…",
        "session": {"id": "0198…", "expires_at": "2026-08-14T14:12:00.000Z"},
        "administrator": {"id": "0198…", "email": "moderator@example.com",
                          "name": "Sam Okafor", "role": "moderator",
                          "created_at": "2026-07-01T09:00:00.000Z"}
      }
      ```

      **`token` is shown once and is never readable again.** The platform stores a hash of it, so
      there is no endpoint that returns it and no way to recover it — a console that loses it signs
      in again.

      Send it as a `Bearer` credential in the standard HTTP credential header, on every
      administrative request.

      ## How long it lasts

      `expires_at` is when the credential stops working, and it moves. The session slides forward
      while the console is being used and ends after **thirty minutes of inactivity** or **twelve
      hours in total**, whichever comes first — so `expires_at` is the earlier of the two and is
      worth re-reading from `GET /v1/admin/me` rather than caching from sign-in.

      There is no refresh endpoint. When it ends, sign in again.

      ## When it is refused

      | Status | `error.code` | What happened |
      |---|---|---|
      | `400` | `admin_credentials_invalid` | The address and password do not match an administrator account |
      | `403` | `admin_account_disabled` | The password was right and the account is out of service |
      | `429` | `rate_limited` | Too many attempts. `Retry-After` says when |

      **`admin_credentials_invalid` is deliberately one answer for two cases** — no such
      administrator, and the wrong password — and the platform spends the same amount of work on
      both, so the response time does not disclose what the status code will not. Which addresses
      are administrators is not something an unauthenticated caller may find out.
    parameters:
      - $ref: '#/IdempotencyKey'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/AdminSignIn'
    responses:
      '200':
        description: |
          Signed in. The token is in the body and will not be shown again.
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestID'
        content:
          application/json:
            schema:
              $ref: '#/AdminSignInResult'
      '400':
        description: |
          Either the request could not be understood, or the credentials do not match
          (`admin_credentials_invalid`). The two are distinguishable by `error.code` and nothing
          else about the failed sign-in is explained.
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestID'
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Error'
      '403':
        description: |
          The password was correct and the account has been disabled (`admin_account_disabled`).
          Signing in again will not help; the account has to be restored.
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestID'
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Error'
      '409':
        description: |
          This `Idempotency-Key` has already been used for a different request
          (`idempotency_key_reused`), or an identical one is still in flight
          (`idempotency_request_in_progress`).
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestID'
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Error'
      '422':
        description: |
          One or more fields were rejected (`validation_failed`), with one `error.details` entry
          per field.
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestID'
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Error'
      '429':
        description: |
          Too many sign-in attempts, counted per account and per network address (`rate_limited`).
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestID'
          Retry-After:
            description: Seconds to wait before trying again.
            schema:
              type: integer
            example: 24
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Error'
      '500':
        $ref: '../openapi.yaml#/components/responses/InternalError'
      '503':
        description: |
          A dependency this request needs is not answering (`service_unavailable`). The rate
          limiter is one of them: it **fails closed**, so an unreachable cache refuses sign-ins
          rather than serving them unlimited.
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestID'
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Error'

AdminCurrentSession:
  delete:
    operationId: adminSignOut
    summary: End the administrator session you are presenting
    tags: [Administration]
    security:
      - BearerAdminSession: []
    description: |
      Ends this session and no other (SHIP-147). The credential stops working immediately — it is a
      row rather than a signature, so there is no window in which a signed-out token is still
      accepted.

      **There is no way to name somebody else's session.** Signing another machine out is a feature
      with an authorisation question behind it and has not been built.

      **Safe to repeat**, in the way that matters to a browser on a poor connection: retry with the
      same `Idempotency-Key` and the original `204` is replayed, without the credential being
      consulted again.

      A *fresh* key on the same credential answers `401` instead, because the session it names has
      already ended — which is the honest answer rather than a second success for something that
      did not happen.
    parameters:
      - $ref: '#/IdempotencyKey'
    responses:
      '204':
        description: The session is over.
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestID'
      '400':
        $ref: '../openapi.yaml#/components/responses/BadRequest'
      '401':
        description: |
          No usable administrator session was presented. `admin_session_expired` means the session
          was genuine and has ended — sign in again; `unauthenticated` means the credential was not
          recognised at all.
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestID'
          WWW-Authenticate:
            description: The authentication scheme this endpoint accepts.
            schema:
              type: string
            example: Bearer error="invalid_token"
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Error'
      '409':
        description: |
          This `Idempotency-Key` has already been used for a different request
          (`idempotency_key_reused`), or an identical one is still in flight
          (`idempotency_request_in_progress`).
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestID'
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Error'
      '500':
        $ref: '../openapi.yaml#/components/responses/InternalError'
      '503':
        description: |
          A dependency this request needs is not answering (`service_unavailable`).
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestID'
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Error'

AdminMe:
  get:
    operationId: adminMe
    summary: Who this administrator session belongs to
    tags: [Administration]
    security:
      - BearerAdminSession: []
    description: |
      The console's first call after signing in and after every reload (SHIP-147).

      It answers two questions: who am I, and how long is this credential good for. Both come from
      the session row the platform reads to authenticate the request, so the answer is current
      rather than whatever was true at sign-in — an administrator whose role changed a minute ago
      sees the new one here.

      **`session.expires_at` moves.** The session slides forward as the console is used, so this is
      the endpoint to re-read it from rather than caching the value sign-in returned.
    responses:
      '200':
        description: The administrator this session belongs to.
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestID'
        content:
          application/json:
            schema:
              $ref: '#/AdminMeResult'
      '401':
        description: |
          No usable administrator session was presented. `admin_session_expired` means it ended;
          `unauthenticated` means it was never valid, or the account behind it has been disabled —
          the platform does not distinguish those two to somebody holding only a token.
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestID'
          WWW-Authenticate:
            description: The authentication scheme this endpoint accepts.
            schema:
              type: string
            example: Bearer error="invalid_token"
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Error'
      '500':
        $ref: '../openapi.yaml#/components/responses/InternalError'
      '503':
        description: |
          A dependency this request needs is not answering (`service_unavailable`).
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestID'
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Error'

AdminAdministrators:
  post:
    operationId: createAdministrator
    summary: Create an administrator account
    tags: [Administration]
    security:
      - BearerAdminSession: []
    description: |
      Adds an administrator (SHIP-147, SHIP-148).

      **Needs the `admins.manage` permission**, which only the `owner` role holds. Somebody who can
      create an administrator can create one with any role, so this is the endpoint the whole
      permission model exists to protect; `support` and `moderator` sessions get `403`
      `admin_permission_denied`.

      ## `role` is optional, and leaving it out is not an error

      An account created without one becomes `support` — the least-privileged role, which can read
      the console and change nothing. It does **not** inherit the creator's role and it is not
      refused. That is deliberate: a forgotten field should produce the account that can do least.

      Sending a role the platform does not have *is* an error (`422`, naming `role`), because that is
      a different mistake — a client that believes in a role which does not exist would otherwise be
      handed the minimum without being told.

      ## There is no bootstrap through this endpoint

      The first administrator in a deployment is created by an operator with a database insert. An
      "allow anybody while the table is empty" branch would be an unauthenticated account-creation
      endpoint for every deployment's first minute.

      ## The password

      Set by whoever creates the account and handed over out of band; there is no invitation email
      and no reset flow yet. Twelve characters is the floor.
    parameters:
      - $ref: '#/IdempotencyKey'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/NewAdministrator'
    responses:
      '201':
        description: |
          The account exists. `role` in the response is what was actually applied, which is worth
          reading — it is `support` whenever the request did not say otherwise.
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestID'
        content:
          application/json:
            schema:
              $ref: '#/Administrator'
      '400':
        $ref: '../openapi.yaml#/components/responses/BadRequest'
      '401':
        description: |
          No usable administrator session was presented.
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestID'
          WWW-Authenticate:
            description: The authentication scheme this endpoint accepts.
            schema:
              type: string
            example: Bearer error="invalid_token"
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Error'
      '403':
        description: |
          The session is valid and the role does not hold `admins.manage`
          (`admin_permission_denied`). The message names no permission — ask whoever administers the
          platform rather than probing for the list.
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestID'
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Error'
      '409':
        description: |
          An administrator already exists with that address (`admin_email_taken`), or the
          `Idempotency-Key` has been used for a different request.
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestID'
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Error'
      '422':
        description: |
          One or more fields were rejected (`validation_failed`), with one `error.details` entry per
          field — including `role` for a role the platform does not have.
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestID'
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Error'
      '500':
        $ref: '../openapi.yaml#/components/responses/InternalError'
      '503':
        description: |
          A dependency this request needs is not answering (`service_unavailable`).
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestID'
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Error'

# --- administration schemas --------------------------------------------------------------------

NewAdministrator:
  type: object
  additionalProperties: false
  required: [email, name, password]
  properties:
    email:
      type: string
      minLength: 3
      maxLength: 320
      description: |
        Case-insensitive, and unique among administrators. It may also be a marketplace account's
        address — the two systems are unrelated and neither implies the other.
      example: sam@example.com
    name:
      type: string
      minLength: 1
      maxLength: 200
      description: Who this is, as the audit trail will record them.
      example: Sam Okafor
    password:
      type: string
      minLength: 12
      maxLength: 512
      description: |
        The initial password, handed over out of band. There is no invitation email and no reset
        flow yet.
      example: correct-horse-battery-staple
    role:
      type: string
      enum: [support, moderator, owner]
      description: |
        **Optional. Omitting it gives `support`**, the least-privileged role — not the creator's,
        and not a refusal.

        A value outside the list is refused rather than minimised, because sending nothing and
        sending a role that does not exist are different mistakes.
      example: moderator

AdminSignIn:
  type: object
  additionalProperties: false
  required: [email, password]
  description: |
    An administrator's credentials. There is no device label: the console has no device list to
    show one in, and a name supplied by the client and never checked would be an unauthenticated
    string in the audit trail.
  properties:
    email:
      type: string
      minLength: 3
      maxLength: 320
      description: |
        Case-insensitive. This is the administrator account's address, which may or may not also be
        a marketplace account — the two are unrelated.
      example: moderator@example.com
    password:
      type: string
      description: |
        Sent as typed. Leading and trailing spaces are significant, because they may be characters
        somebody chose.
      example: correct-horse-battery-staple

AdminSignInResult:
  type: object
  additionalProperties: false
  required: [token, session, administrator]
  properties:
    token:
      type: string
      description: |
        The session credential, sent as a `Bearer` credential in the standard HTTP credential
        header. The `BearerAdminSession` scheme in the root document names it.

        **Shown once.** The platform stores only a hash of it, so nothing can return it again.
      example: 9dW3nP1qTzR7lK0sYbV2xC8gH4jM6oA5eF1uI3rQ7wY
    session:
      $ref: '#/AdminSession'
    administrator:
      $ref: '#/Administrator'

AdminMeResult:
  type: object
  additionalProperties: false
  required: [administrator, session]
  properties:
    administrator:
      $ref: '#/Administrator'
    session:
      $ref: '#/AdminSession'

AdminSession:
  type: object
  additionalProperties: false
  required: [id, expires_at]
  description: |
    The console session this request is being served under.
  properties:
    id:
      type: string
      format: uuid
      description: |
        Which sign-in this is. An administrator signed in on two machines has two sessions, and
        signing out ends only the one whose credential was presented.
      example: 0198f2c1-6b40-7a11-9c3e-2f9a4d51b7e3
    expires_at:
      type: string
      format: date-time
      description: |
        When this credential stops working, in UTC — the earlier of the idle limit and the absolute
        one. **It moves**: using the console pushes the idle limit forward, and never past the
        absolute one. Only one figure is published, because a client that computed the answer from
        two would get it wrong on the day either constant changes.
      example: '2026-08-14T14:12:00.000Z'

Administrator:
  type: object
  additionalProperties: false
  required: [id, email, name, role, permissions, created_at]
  description: |
    An administrator account.

    **There is no status field.** An account that is not active cannot sign in and cannot hold a
    session, so a status here would read `active` on every account the console can reach — which is
    exactly the kind of field a client eventually branches on and is wrong about.
  properties:
    id:
      type: string
      format: uuid
      description: |
        The administrator's identifier. This is what the audit trail records as the actor, and it is
        **not** a `users` id — the two tables are unrelated and their identifiers are not
        interchangeable.
      example: 0198f2c1-6b40-7a11-9c3e-2f9a4d51b7e0
    email:
      type: string
      example: moderator@example.com
    name:
      type: string
      description: Who this is, as support and the audit trail refer to them.
      example: Sam Okafor
    role:
      type: string
      enum: [support, moderator, owner]
      description: |
        The named bundle of permissions this administrator holds, listed least privileged first.

        - `support` — read only: search users and jobs, read the queues, read a dispute, read the
          audit trail. This is what an account with no role stated becomes.
        - `moderator` — support, plus acting on what it can see.
        - `owner` — moderator, plus managing administrator accounts.
      example: moderator
    permissions:
      type: array
      items:
        type: string
      description: |
        What this role holds, expanded, sorted. Published so the console can **hide what it may not
        do** — and never so it can decide: every endpoint checks the permission against the role in
        the session row on each request, so editing this list in a response changes nothing.

        Sent expanded rather than left for a client to derive from `role`, because a derivation is a
        second copy of the mapping in TypeScript, and it is the copy that drifts — nothing fails
        when a console shows a button that answers `403`.

        Always present. An empty list is a real answer, not an error.
      example:
        - audit.read
        - disputes.read
        - jobs.read
        - moderation.read
        - users.read
        - verifications.read
    created_at:
      type: string
      format: date-time
      example: '2026-07-01T09:00:00.000Z'

# --- the delivery-exception moderation queue (SHIP-117) -----------------------------------------

AdminExceptionQueue:
  get:
    operationId: adminExceptionQueue
    summary: Deliveries evidenced by a reason rather than a photograph
    tags: [Administration]
    security:
      - BearerAdminSession: []
    description: |
      Docs/04 §5's fourth moderation queue, in the part of it this ticket builds: **failed proof of
      delivery** (SHIP-117). Overdue pickup and delayed delivery join it at SHIP-157.

      A delivery reaches this list by being recorded with a reason in place of a photograph — the
      exception path of Docs/01 §4.4, which exists so that a driver standing at a delivery point is
      never unable to finish the job. Three reasons are possible and no others: `recipient_objected`,
      `camera_unavailable`, `location_unsafe`.

      **The queue is a query over the evidence, not a table of flags.** There is nothing to mark as
      read, nothing to claim and nothing to tick off — Docs/04 §6's process ends in a recorded
      decision rather than in an entry disappearing. An entry stays here for as long as the row it
      describes exists, which is for ever.

      ## What an entry does and does not carry

      There is no photograph and no signed URL, because by construction there is none — a proof row
      is a photograph or a reason and never both. There is no customer, no provider and **no
      budget**: an entry is what somebody triaging needs in order to decide whether to open the job.

      `job_status` is where the job is now, for triage. It implies nothing about whether a delivery
      completed this way may auto-complete after 72 hours; that question is open.

      `recorded_at` is the platform's clock, not the driver's device's. A queue ordered by a
      handset's clock could be reordered by a handset with the wrong time, which is a queue an entry
      can hide at the back of.

      ## Ordering and paging

      Oldest first, because Docs/04 §8 sets acknowledgement targets and the oldest entry is the one
      closest to breaching one. Cursor paged: the queue grows at the end while somebody is reading
      it, and an offset would show the same entry twice or skip one.

      ## Permission

      Needs `moderation.read`, which every administrator role holds. Acting on what is in the queue
      is a different permission on a different endpoint.
    parameters:
      - name: limit
        in: query
        required: false
        description: How many entries to return.
        schema:
          type: integer
        example: 25
      - name: cursor
        in: query
        required: false
        description: |
          Where the previous page stopped, taken from `next_cursor`. A cursor this endpoint did not
          issue is a `400` rather than an empty page — a client that sent one has a bug, and
          answering "nothing here" would let it page for ever through a queue it never saw.
        schema:
          type: string
    responses:
      '200':
        description: One page of the queue, oldest first.
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestID'
        content:
          application/json:
            schema:
              $ref: '#/ExceptionQueuePage'
      '400':
        $ref: '../openapi.yaml#/components/responses/BadRequest'
      '401':
        description: |
          No usable administrator session was presented.
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestID'
          WWW-Authenticate:
            description: The authentication scheme this endpoint accepts.
            schema:
              type: string
            example: Bearer error="invalid_token"
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Error'
      '403':
        description: |
          The session is valid and the role does not hold `moderation.read`
          (`admin_permission_denied`).
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestID'
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Error'
      '500':
        $ref: '../openapi.yaml#/components/responses/InternalError'
      '503':
        description: |
          A dependency this request needs is not answering (`service_unavailable`).
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestID'
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Error'

ExceptionQueuePage:
  type: object
  additionalProperties: false
  required: [data, has_more]
  description: |
    The standard collection envelope (`Docs/10` §4.5). `data` is always an array, never `null`.
  properties:
    data:
      type: array
      items:
        $ref: '#/ExceptionQueueEntry'
    next_cursor:
      type: string
      description: |
        Pass as `cursor` for the next page. Absent when this is the last one.
      example: MjAyNi0wOC0xNFQwMjoxNTozMC4wMDBafDAxOThmMmMx
    has_more:
      type: boolean
      description: |
        Carried rather than inferred from `next_cursor`, because an absent cursor is also what the
        *first* request looks like and a client should not have to know the difference.
      example: false

ExceptionQueueEntry:
  type: object
  additionalProperties: false
  required: [proof_id, job_id, milestone, reason, note, recorded_at, job_status]
  description: |
    One delivery recorded with a reason in place of a photograph.
  properties:
    proof_id:
      type: string
      format: uuid
      description: The evidence row. Also what the cursor is built from.
      example: 0198f2c1-6b40-7a11-9c3e-2f9a4d51b7e4
    job_id:
      type: string
      format: uuid
      description: The delivery to open.
      example: 0198f2c1-6b40-7a11-9c3e-2f9a4d51b7e1
    milestone:
      type: string
      description: |
        Which recorded claim the exception stands behind — `Delivered` for the deliveries Docs/01
        §4.4 is about. Reported rather than assumed, so an exception recorded against another
        milestone is visible rather than silently dropped.
      example: Delivered
    reason:
      type: string
      enum: [recipient_objected, camera_unavailable, location_unsafe]
      description: |
        Why there is no photograph, from Docs/01 §4.4's three. There is deliberately no `other`: a
        reason nobody can group is a queue nobody can triage.
      example: recipient_objected
    note:
      type: string
      description: |
        The actor's own words, where they left any. Always present and frequently empty — the
        milestone's note is optional, and a driver who selected a reason has already said the most
        important part.
      example: The recipient asked me not to photograph their door.
    recorded_at:
      type: string
      format: date-time
      description: |
        When the platform recorded the evidence, in UTC, on the platform's clock — **not** the
        driver's device's. See the operation description.
      example: '2026-08-14T02:15:30.000Z'
    job_status:
      type: string
      description: |
        Where the job is now, for triage. It implies nothing about whether a delivery completed
        this way may auto-complete.
      example: Delivered

AdminUsers:
  get:
    operationId: adminSearchUsers
    summary: Search user accounts
    tags: [Administration]
    security:
      - BearerAdminSession: []
    description: |
      Docs/01 §4.6's first administrative capability — "search users, jobs, bids, and disputes" —
      in the part of it this ticket builds (SHIP-151). Searching jobs and bids is SHIP-152.

      ## What can be searched

      `q` matches an **email address, a name or a phone number**, anywhere within any of them. One
      parameter for all three rather than three, because a support engineer has a string off a
      ticket and does not always know which it is; a console that made them choose would be asking a
      question the platform can answer by trying each. `status` narrows to one account standing.

      **The name arrived a wave after the rest of this endpoint.** `users` held an address, a
      number, a role, a standing and two verification timestamps, and registration never asked for a
      person's name — so the ticket's fourth term had no column and the gap was recorded in
      `Docs/11` §4 rather than served by a parameter that could only ever match nothing. SHIP-30a
      added the column and made registration require it, and this endpoint serves all four terms.

      **An account created before that migration has no name**, which is a real state rather than a
      defect: a name cannot be backfilled. Such an account is never matched by a name term — it is
      found by its address or its number — and its `name` comes back empty rather than as a
      placeholder that would read as a name somebody chose.

      ## What an account carries here, and what it never will

      Account facts only. **No jobs, no bids, and nothing commercial** — a customer's maximum budget
      is never exposed in any form (Docs/01 §4.3), and the surest way to keep an administrative
      shape clear of one is for it never to have carried anything from that side of the platform.
      No password material of any kind: the column is not selected and there is nowhere in the shape
      to put it.

      `status` is the account's **standing**, which is not the same thing as provider verification —
      that is an eligibility decision with its own five states (Docs/04 §4) and its own queue
      (SHIP-153).

      The two verification fields record *when*, not *whether*, and are empty while a channel is
      unconfirmed. A support conversation asks "since when" as often as it asks "is it".

      ## Ordering and paging

      Newest first, and deliberately unlike the moderation queue: that one is oldest-first because
      Docs/04 §8 sets acknowledgement targets and the oldest entry is closest to breaching one. A
      search has no such target. Cursor paged, on `(created_at, id)` — accounts registered in the
      same instant would make a single-column cursor either skip one or repeat it, and a search that
      can hide an account is worse than one that shows it twice.

      ## Permission

      Needs `users.read`, which every administrator role holds: looking is what the least-privileged
      role exists to be able to do. Restricting or suspending an account is `users.restrict` on a
      different endpoint (SHIP-161).
    parameters:
      - name: q
        in: query
        required: false
        description: |
          Matches an email address, a name or a phone number, anywhere within any of them. Absent
          or empty matches every account, which with `status` is how "list the suspended accounts"
          is expressed.

          **It is a string, not a pattern.** `%` and `_` are matched literally rather than as
          wildcards, so a search box cannot be turned into a full read of the table.
        schema:
          type: string
          maxLength: 320
        example: '@acme.example'
      - name: status
        in: query
        required: false
        description: |
          Narrows to one account standing. Absent matches every standing. A value that is not one
          of the three is refused rather than ignored — an ignored filter answers with every
          account, which reads exactly like "every account is suspended" to somebody who mistyped.
        schema:
          type: string
          enum: [active, restricted, suspended]
        example: suspended
      - name: limit
        in: query
        required: false
        description: How many accounts to return.
        schema:
          type: integer
        example: 25
      - name: cursor
        in: query
        required: false
        description: |
          Where the previous page stopped, taken from `next_cursor`. A cursor this endpoint did not
          issue is a `400` rather than an empty page — a client that sent one has a bug, and
          answering "nothing here" would let it page for ever through a list it never saw.
        schema:
          type: string
    responses:
      '200':
        description: One page of accounts, newest first.
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestID'
        content:
          application/json:
            schema:
              $ref: '#/UserSearchPage'
      '400':
        $ref: '../openapi.yaml#/components/responses/BadRequest'
      '401':
        description: |
          No usable administrator session was presented.
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestID'
          WWW-Authenticate:
            description: The authentication scheme this endpoint accepts.
            schema:
              type: string
            example: Bearer error="invalid_token"
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Error'
      '403':
        description: |
          The session is valid and the role does not hold `users.read`
          (`admin_permission_denied`).
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestID'
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Error'
      '422':
        description: |
          A query parameter carried a value the platform does not have (`validation_failed`), with
          one `error.details` entry per field — `status` for a standing that is not one of the
          three, `q` for a term longer than any address it could match. Refused rather than
          ignored: an ignored filter answers with every account, which reads exactly like "every
          account is in that standing" to somebody who mistyped one.
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestID'
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Error'
      '500':
        $ref: '../openapi.yaml#/components/responses/InternalError'
      '503':
        description: |
          A dependency this request needs is not answering (`service_unavailable`).
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestID'
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Error'

UserSearchPage:
  type: object
  additionalProperties: false
  required: [data, has_more]
  description: |
    The standard collection envelope (`Docs/10` §4.5). `data` is always an array, never `null`.
  properties:
    data:
      type: array
      items:
        $ref: '#/UserAccount'
    next_cursor:
      type: string
      description: |
        Pass as `cursor` for the next page. Absent when this is the last one.
      example: MjAyNi0wNS0wMVQwOTowMDowMC4wMDBafDAxOThmMmMx
    has_more:
      type: boolean
      description: |
        Carried rather than inferred from `next_cursor`, because an absent cursor is also what the
        *first* request looks like and a client should not have to know the difference.
      example: false

UserAccount:
  type: object
  additionalProperties: false
  required:
    - id
    - name
    - email
    - phone
    - role
    - status
    - email_verified_at
    - phone_verified_at
    - created_at
  description: |
    One account as an administrator sees it. Account facts only — no jobs, no bids, no budget and
    no credential material of any kind.
  properties:
    id:
      type: string
      format: uuid
      example: 0198f2c1-6b40-7a11-9c3e-2f9a4d51b7e4
    name:
      type: string
      description: |
        What the account holder is called, collected at registration (SHIP-30a) and one of the four
        terms `q` matches. Always present, and **empty for an account created before `000006`** —
        a name cannot be backfilled, so the console shows the absence.
      example: Hana Osei
    email:
      type: string
      format: email
      example: hana@acme.example
    phone:
      type: string
      description: E.164, as the account holds it.
      example: '+61400111222'
    role:
      type: string
      enum: [customer, provider]
      description: |
        Fixed at registration and immutable thereafter. There is no transition between the two.
      example: customer
    status:
      type: string
      enum: [active, restricted, suspended]
      description: |
        The account's standing — whether it may be used at all. **Not** provider verification,
        which is a separate eligibility decision with five states of its own (Docs/04 §4).
      example: active
    email_verified_at:
      type: string
      description: |
        When the address was confirmed, in UTC. Empty while it has not been. A timestamp rather
        than a boolean, because "since when" is asked as often as "is it".
      example: '2026-05-01T09:12:00.000Z'
    phone_verified_at:
      type: string
      description: |
        When the number was confirmed, in UTC. Empty while it has not been.
      example: ''
    created_at:
      type: string
      format: date-time
      description: When the account was registered, in UTC.
      example: '2026-05-01T09:00:00.000Z'

AdminJobs:
  get:
    operationId: adminSearchJobs
    summary: Search jobs
    tags: [Administration]
    security:
      - BearerAdminSession: []
    description: |
      Docs/01 §4.6's first administrative capability, second term — "search users, jobs, bids, and
      disputes" (SHIP-152). Searching accounts is `GET /v1/admin/users` (SHIP-151).

      ## What can be searched

      `q` matches the **goods description**, anywhere within it. That is what a support engineer
      holds when they are searching — a sentence off a ticket, "the piano", "two pallets of tiles".
      Somebody holding a job identifier opens the job instead, which is `GET /v1/admin/jobs/{id}`.

      `status` narrows to one of Docs/02 §1's job statuses and `customer` to one account's jobs.

      ## The status vocabulary here is the stored form, not the wire form

      `Driver assigned`, not `driver_assigned`. A departure from the lower snake case Docs/10 §4.7
      puts on every other enumeration, taken deliberately and consistently with `job_status` on the
      exception queue: the console is an operator surface, and somebody reading a screen beside a
      `psql` window should see one vocabulary rather than two.

      It applies to the `status` **filter** as well as to the field, which is the property that
      matters most — a console displaying one vocabulary and filtering on another would make every
      filter a guess.

      ## What a job carries here, and what it never will

      **No budget.** Docs/01 §4.3's invariant names providers, so an administrator is not the
      audience it protects the customer's maximum from — leaving it out is a decision rather than a
      rule, and the reasoning is that nothing in this capability asks for it and a shape that never
      carried one cannot leak one. The named revisit is SHIP-164, where an administrator resolving a
      dispute about price may genuinely need it.

      **No addresses and no contact details**, per Docs/01 §5.1's "minimise exposure of phone
      numbers, addresses, and delivery details". What identifies a job on a console screen is its
      description, its customer, its status and its dates.

      `bid_count` counts **every** bid in every status. What a scan of this list answers is whether
      anybody engaged with the job at all, and three withdrawn offers is a very different fact from
      no offers.

      ## Ordering and paging

      Newest first, like the account search and unlike the moderation queue — a search has no
      acknowledgement target, and the jobs somebody is looking for are overwhelmingly recent. Cursor
      paged on `(created_at, id)`; jobs published in the same instant would make a single-column
      cursor either skip one or repeat it.

      ## Permission

      Needs `jobs.read`, which every administrator role holds: looking is what the least-privileged
      role exists to be able to do. Unpublishing a job is `jobs.unpublish` on a different endpoint
      (SHIP-160).
    parameters:
      - name: q
        in: query
        required: false
        description: |
          Matches the goods description, anywhere within it. Absent or empty matches every job,
          which with the two filters below is how "every open job for this customer" is expressed.

          **It is a string, not a pattern.** `%` and `_` are matched literally rather than as
          wildcards, so a search box cannot be turned into a full read of the table.

          A draft that never reached the details step has no description and matches no term.
        schema:
          type: string
          maxLength: 200
        example: piano
      - name: status
        in: query
        required: false
        description: |
          Narrows to one job status, in Docs/02 §1's **stored** form. Absent matches every status. A
          value that is not one of the twelve is refused rather than ignored — an ignored filter
          answers with every job, which reads exactly like "the whole marketplace is delivered" to
          somebody who mistyped one.
        schema:
          type: string
          enum:
            - Draft
            - Open
            - Negotiating
            - Awarded
            - Driver assigned
            - En route to pickup
            - Picked up
            - In transit
            - Delivered
            - Completed
            - Cancelled
            - Disputed
        example: Open
      - name: customer
        in: query
        required: false
        description: Narrows to one customer's jobs. Absent matches every customer.
        schema:
          type: string
          format: uuid
        example: 0198f2c1-6b40-7a11-9c3e-2f9a4d51b7e4
      - name: limit
        in: query
        required: false
        description: How many jobs to return.
        schema:
          type: integer
        example: 25
      - name: cursor
        in: query
        required: false
        description: |
          Where the previous page stopped, taken from `next_cursor`. A cursor this endpoint did not
          issue is a `400` rather than an empty page.
        schema:
          type: string
    responses:
      '200':
        description: One page of jobs, newest first.
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestID'
        content:
          application/json:
            schema:
              $ref: '#/JobSearchPage'
      '400':
        $ref: '../openapi.yaml#/components/responses/BadRequest'
      '401':
        description: |
          No usable administrator session was presented.
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestID'
          WWW-Authenticate:
            description: The authentication scheme this endpoint accepts.
            schema:
              type: string
            example: Bearer error="invalid_token"
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Error'
      '403':
        description: |
          The session is valid and the role does not hold `jobs.read`
          (`admin_permission_denied`).
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestID'
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Error'
      '422':
        description: |
          A query parameter carried a value the platform does not have (`validation_failed`), with
          one `error.details` entry per field — `status` for a status that is not one of the twelve,
          `customer` for an identifier that is not a UUID, `q` for a term longer than any
          description it could match.
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestID'
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Error'
      '500':
        $ref: '../openapi.yaml#/components/responses/InternalError'
      '503':
        description: |
          A dependency this request needs is not answering (`service_unavailable`).
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestID'
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Error'

AdminJob:
  get:
    operationId: adminOpenJob
    summary: Open one job with its full bid and status history
    tags: [Administration]
    security:
      - BearerAdminSession: []
    description: |
      The second half of SHIP-152 — "open **any** job with its full bid and status history" — and
      *any* is the word doing the work. Every job is an administrator's to open; there is no
      ownership scope on this endpoint and no `404` standing in for a refusal, which is the opposite
      of every other job endpoint in this API and is exactly what Docs/01 §4.6 asks for.

      A `404` here means the job genuinely does not exist.

      ## One response rather than three endpoints

      The job, every bid on it and every recorded transition, read in **one snapshot**. A console
      making three calls to draw one screen is three chances to show a job beside somebody else's
      bids, or an `Awarded` header above a bid list in which nothing is accepted. A support screen
      that contradicts itself is worse than a stale one, because somebody acts on it.

      ## Bid amounts are here and the customer's budget is not

      Docs/02 §4: "bid history remains visible to the customer, bidding provider, and
      administrators". This is that third reader, and unlike the two views a provider and a customer
      get, it is not scoped to one provider's chain — an administrator looking at a disputed award
      needs the offers it was chosen over.

      The customer's maximum budget is a different fact with a different audience and is on no shape
      in this API outside the customer's own.

      ## Both clocks on every transition, never one

      Docs/02 §3.1 keeps the actor's claim (`actor_recorded_at`) apart from the platform's
      acceptance (`server_recorded_at`) because a driver records a milestone with no signal and the
      device syncs later. The history is ordered by the **platform's** clock: a timeline ordered by
      the device's could be reordered by a handset with the wrong time.

      ## Permission

      Needs `jobs.read`, which every administrator role holds.
    parameters:
      - name: id
        in: path
        required: true
        description: The job to open.
        schema:
          type: string
          format: uuid
    responses:
      '200':
        description: The job, its bids and its recorded transitions.
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestID'
        content:
          application/json:
            schema:
              $ref: '#/AdminJobDetail'
      '400':
        $ref: '../openapi.yaml#/components/responses/BadRequest'
      '401':
        description: |
          No usable administrator session was presented.
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestID'
          WWW-Authenticate:
            description: The authentication scheme this endpoint accepts.
            schema:
              type: string
            example: Bearer error="invalid_token"
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Error'
      '403':
        description: |
          The session is valid and the role does not hold `jobs.read`
          (`admin_permission_denied`).
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestID'
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Error'
      '404':
        description: |
          There is no such job (`not_found`). Unlike the same answer on the dispute endpoint, this
          is not a disclosure decision — an administrator holding `jobs.read` may open any job, so
          there is nothing here being kept from them.
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestID'
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Error'
      '500':
        $ref: '../openapi.yaml#/components/responses/InternalError'
      '503':
        description: |
          A dependency this request needs is not answering (`service_unavailable`).
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestID'
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Error'

JobSearchPage:
  type: object
  additionalProperties: false
  required: [data, has_more]
  description: |
    The standard collection envelope (`Docs/10` §4.5). `data` is always an array, never `null`.
  properties:
    data:
      type: array
      items:
        $ref: '#/AdminJobSummary'
    next_cursor:
      type: string
      description: |
        Pass as `cursor` for the next page. Absent when this is the last one.
      example: MjAyNi0wOC0wMVQwOTowMDowMC4wMDBafDAxOThmMmMx
    has_more:
      type: boolean
      description: |
        Carried rather than inferred from `next_cursor`, because an absent cursor is also what the
        *first* request looks like.
      example: false

AdminJobDetail:
  type: object
  additionalProperties: false
  required: [job, bids, history]
  description: |
    One job as an administrator sees it, with everything recorded against it. `bids` and `history`
    are always arrays, never `null` — an absent list and an empty one are the same fact here, and
    `null` crashes a console that iterates without checking on the one job that had neither.
  properties:
    job:
      $ref: '#/AdminJobSummary'
    bids:
      type: array
      description: Every offer on the job, in every status, oldest first.
      items:
        $ref: '#/AdminBid'
    history:
      type: array
      description: Every recorded transition, oldest first on the platform's clock.
      items:
        $ref: '#/AdminStatusEvent'

AdminJobSummary:
  type: object
  additionalProperties: false
  required:
    - id
    - customer_id
    - status
    - goods_description
    - bid_count
    - expires_at
    - created_at
    - updated_at
  description: |
    One job as an administrator sees it. **No budget, no addresses and no contact details** — see
    the endpoint description.
  properties:
    id:
      type: string
      format: uuid
      example: 0198f2c1-6b40-7a11-9c3e-2f9a4d51b7e4
    customer_id:
      type: string
      format: uuid
      description: The account that owns the job.
      example: 0198f2c1-6b40-7a11-9c3e-2f9a4d51b7e5
    status:
      type: string
      description: |
        Docs/02 §1's **stored** form — `En route to pickup`, not `en_route_to_pickup`. See the
        endpoint description for why this one enumeration departs from Docs/10 §4.7.
      enum:
        - Draft
        - Open
        - Negotiating
        - Awarded
        - Driver assigned
        - En route to pickup
        - Picked up
        - In transit
        - Delivered
        - Completed
        - Cancelled
        - Disputed
      example: Open
    goods_description:
      type: string
      description: |
        What the customer said they are sending. Empty on a draft that never reached the details
        step.
      example: An upright piano and two stools
    bid_count:
      type: integer
      description: |
        How many bids the job carries, in **every** status. Three withdrawn offers and no offers
        are very different facts about whether anybody engaged with a job.
      example: 3
    expires_at:
      type: string
      description: |
        When an unclaimed job lapses, in UTC. Empty where none is set. Always present, so a console
        that renders without checking does not crash on the ordinary case.
      example: '2026-08-20T09:00:00.000Z'
    created_at:
      type: string
      format: date-time
      description: When the job was created, in UTC.
      example: '2026-08-01T09:00:00.000Z'
    updated_at:
      type: string
      format: date-time
      description: When the job row last changed, in UTC.
      example: '2026-08-02T14:30:00.000Z'

AdminBid:
  type: object
  additionalProperties: false
  required:
    - id
    - provider_id
    - status
    - offered_by
    - amount_cents
    - pickup_at
    - deliver_by
    - message
    - superseded_by
    - created_at
    - updated_at
  description: |
    One offer on the job. Docs/02 §4 makes bid history visible to the customer, the bidding provider
    and administrators; this is the third of those readers, and the only one that sees every
    provider's offers on one job.
  properties:
    id:
      type: string
      format: uuid
      example: 0198f2c1-6b40-7a11-9c3e-2f9a4d51b7e6
    provider_id:
      type: string
      format: uuid
      description: The provider whose offer this is.
      example: 0198f2c1-6b40-7a11-9c3e-2f9a4d51b7e7
    status:
      type: string
      description: Docs/02 §4's stored form.
      enum: [Draft, Submitted, Countered, Accepted, Rejected, Withdrawn, Expired, Superseded]
      example: Accepted
    offered_by:
      type: string
      description: |
        Which side made this offer. A customer's counter-offer is a bid row like any other, and a
        reader who could not tell the two apart would read a negotiation as one party bidding
        against themselves.
      enum: [provider, customer]
      example: provider
    amount_cents:
      type: integer
      format: int64
      description: |
        The offer, in cents. `0` where the row carries no amount, which a draft bid may not have —
        `ck_bids_amount` refuses a non-positive amount, so `0` and "absent" cannot be confused.
      example: 45000
    pickup_at:
      type: string
      description: The pickup time offered, in UTC. Empty where the row carries none.
      example: '2026-08-05T07:00:00.000Z'
    deliver_by:
      type: string
      description: The delivery time offered, in UTC. Empty where the row carries none.
      example: '2026-08-06T17:00:00.000Z'
    message:
      type: string
      description: The offering party's note, where they left one. Empty otherwise.
      example: Happy to bring a second person for the stairs.
    superseded_by:
      type: string
      description: |
        The offer that displaced this one, so a reader can follow a negotiation in the order it
        happened rather than by comparing timestamps. Empty on an offer nothing displaced.
      example: ''
    created_at:
      type: string
      format: date-time
      example: '2026-08-01T11:00:00.000Z'
    updated_at:
      type: string
      format: date-time
      example: '2026-08-01T11:30:00.000Z'

AdminStatusEvent:
  type: object
  additionalProperties: false
  required:
    - id
    - from
    - to
    - actor_type
    - actor_id
    - reason
    - actor_recorded_at
    - server_recorded_at
  description: |
    One recorded transition. **Both clocks, never one** — see the endpoint description.
  properties:
    id:
      type: string
      format: uuid
      example: 0198f2c1-6b40-7a11-9c3e-2f9a4d51b7e8
    from:
      type: string
      description: The status the job left, in Docs/02 §1's stored form.
      example: Open
    to:
      type: string
      description: The status the job reached, in Docs/02 §1's stored form.
      example: Awarded
    actor_type:
      type: string
      description: |
        Who moved it. Finer than the audit log's three actor kinds, because the difference between
        a provider and the driver they nominated is exactly the distinction support needs when a
        delivery goes wrong.
      enum: [customer, provider, driver, admin, system]
      example: customer
    actor_id:
      type: string
      description: |
        The account that acted, or the driver assignment for a driver. Empty for `system`, which is
        the platform acting with no account behind it.
      example: 0198f2c1-6b40-7a11-9c3e-2f9a4d51b7e5
    reason:
      type: string
      description: |
        Why, where one was given. Required of an administrator by the schema and optional for
        everybody else.
      example: ''
    actor_recorded_at:
      type: string
      format: date-time
      description: |
        When the actor says they acted, in UTC. On a device with no signal this can be well before
        the platform heard about it.
      example: '2026-08-02T14:29:00.000Z'
    server_recorded_at:
      type: string
      format: date-time
      description: When the platform accepted it, in UTC. The trail is ordered by this.
      example: '2026-08-02T14:30:00.000Z'

AdminAudit:
  get:
    operationId: adminSearchAuditLog
    summary: Search the immutable audit trail
    tags: [Administration]
    security:
      - BearerAdminSession: []
    description: |
      Docs/01 §4.6's last administrative capability — "view an immutable history of important
      actions" (SHIP-165) — and the read side of SHIP-150, which writes the entries.

      ## The trail is append-only, and this API offers no other verb on it

      There is no `POST`, no `PATCH` and no `DELETE` on this path, and there will not be. Docs/04 §9
      requires that ordinary administrators cannot delete audit history; the permission catalogue
      has no permission that would authorise it, and the database refuses `UPDATE` and `DELETE` on
      `audit_log` by trigger — from **any** connection, including a `psql` prompt, so the guarantee
      does not depend on this service.

      Entries are written by the actions that cause them, in the same transaction, never by a
      request to this endpoint. An action whose entry cannot be written does not happen.

      ## What can be searched

      `actor` is what one administrator did, and it is the first question anybody asks of a trail.
      `target` is everything that happened to one thing — an administrator, a user, a job — and it
      reads across kinds deliberately, because an identifier is already unique and a caller should
      not have to know which kind it is. `from` and `to` bound it by date.

      `action` is a fourth and is not in the ticket's wording. It is here because the table was built
      around it: the column holds a **stable identifier rather than a sentence**, precisely so the
      log is searchable by action, and a column created for a search with no way to search it would
      be the odd omission.

      Every filter is refused rather than ignored when it carries a value the platform does not
      have. An ignored filter answers with the whole trail, and "everything" and "the seventeen
      entries for this action" are indistinguishable to somebody who mistyped one — who then
      concludes the action never happened.

      ## `from` is inclusive and `to` is exclusive

      The only pair that makes consecutive days tile without overlapping: somebody asking for the
      3rd and then the 4th must not be shown an entry twice, and an inclusive upper bound at
      midnight shows every entry written in that instant on both days.

      Both accept a **day** (`2026-08-14`) or a **full instant** (`2026-08-14T09:30:00Z`). A support
      engineer types the first and a console sends the second; accepting only the second would make
      the endpoint unusable by hand, which is most of what it is for. A bare day is read as UTC
      midnight, because the column holds the platform's clock and reading it in the server's local
      zone would move the boundary whenever the deployment moved.

      ## Ordering and paging

      Newest first — somebody opening a trail is almost always asking what happened recently. Cursor
      paged on `(created_at, id)`, and here the second field is not a nicety: every entry written in
      one transaction shares the same instant **by design**, so a single-column cursor would skip an
      entry or repeat one on exactly the rows most worth reading together. The identifier is
      time-ordered, so entries appended in one transaction come back in the order they were
      appended.

      ## Permission

      Needs `audit.read`, which every administrator role holds including the least privileged. A
      trail only the people it records can read is not a control.
    parameters:
      - name: actor
        in: query
        required: false
        description: |
          Narrows to what one account did. Absent matches every actor. Entries written by the
          platform itself have no actor and are matched by no value here.
        schema:
          type: string
          format: uuid
        example: 0198f2c1-6b40-7a11-9c3e-2f9a4d51b7e4
      - name: target
        in: query
        required: false
        description: |
          Narrows to everything done to one thing, whatever kind of thing it is. Absent matches
          every target.
        schema:
          type: string
          format: uuid
        example: 0198f2c1-6b40-7a11-9c3e-2f9a4d51b7e5
      - name: action
        in: query
        required: false
        description: |
          Narrows to one kind of entry. Absent matches every action. A value the platform does not
          record is refused rather than ignored.

          The list grows one value per ticket that adds a privileged action, so a client should not
          hard-code it — the refusal names the current set.
        schema:
          type: string
        example: administrator.created
      - name: from
        in: query
        required: false
        description: |
          The earliest instant to include, **inclusive**. A day or a full instant; a day is read as
          UTC midnight. Absent is unbounded.
        schema:
          type: string
        example: '2026-08-14'
      - name: to
        in: query
        required: false
        description: |
          The instant to stop before, **exclusive**. A day or a full instant. Absent is unbounded.
          A range that ends before it starts is refused rather than answered with an empty page.
        schema:
          type: string
        example: '2026-08-15'
      - name: limit
        in: query
        required: false
        description: How many entries to return.
        schema:
          type: integer
        example: 25
      - name: cursor
        in: query
        required: false
        description: |
          Where the previous page stopped, taken from `next_cursor`. A cursor this endpoint did not
          issue is a `400` rather than an empty page.
        schema:
          type: string
    responses:
      '200':
        description: One page of the trail, newest first.
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestID'
        content:
          application/json:
            schema:
              $ref: '#/AuditPage'
      '400':
        $ref: '../openapi.yaml#/components/responses/BadRequest'
      '401':
        description: |
          No usable administrator session was presented.
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestID'
          WWW-Authenticate:
            description: The authentication scheme this endpoint accepts.
            schema:
              type: string
            example: Bearer error="invalid_token"
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Error'
      '403':
        description: |
          The session is valid and the role does not hold `audit.read`
          (`admin_permission_denied`).
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestID'
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Error'
      '422':
        description: |
          A query parameter carried a value the platform does not have (`validation_failed`), with
          one `error.details` entry per field — `action` for an action nothing records, `actor` or
          `target` for something that is not an identifier, `from` or `to` for something that is not
          a date, and `to` for a range that ends before it starts.
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestID'
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Error'
      '500':
        $ref: '../openapi.yaml#/components/responses/InternalError'
      '503':
        description: |
          A dependency this request needs is not answering (`service_unavailable`).
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestID'
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Error'

AuditPage:
  type: object
  additionalProperties: false
  required: [data, has_more]
  description: |
    The standard collection envelope (`Docs/10` §4.5). `data` is always an array, never `null`.
  properties:
    data:
      type: array
      items:
        $ref: '#/AuditEntry'
    next_cursor:
      type: string
      description: |
        Pass as `cursor` for the next page. Absent when this is the last one.
      example: MjAyNi0wOC0xNFQwOTowMDowMC4wMDBafDAxOThmMmMx
    has_more:
      type: boolean
      description: |
        Carried rather than inferred from `next_cursor`, because an absent cursor is also what the
        *first* request looks like.
      example: false

AuditEntry:
  type: object
  additionalProperties: false
  required:
    - id
    - actor_type
    - actor_id
    - action
    - target_type
    - target_id
    - reason
    - metadata
    - created_at
  description: |
    One thing that happened, exactly as it was recorded. **Nothing is withheld and nothing is
    redacted** — a viewer showing a filtered version of the record would be a second record, and the
    one somebody checks would be the wrong one. What keeps that safe is that nothing commercial is
    ever written into an entry in the first place.
  properties:
    id:
      type: string
      format: uuid
      description: |
        Time-ordered, so entries appended in one transaction sort in the order they were appended
        even though they share an instant.
      example: 0198f2c1-6b40-7a11-9c3e-2f9a4d51b7e4
    actor_type:
      type: string
      description: |
        What kind of thing acted. `system` is the platform acting with nobody behind it — the expiry
        sweep, the auto-complete timer.
      enum: [admin, user, system]
      example: admin
    actor_id:
      type: string
      description: |
        The account that acted. Empty for `system`, which has none — and the schema requires exactly
        that, so an empty value here is a fact rather than a missing one.
      example: 0198f2c1-6b40-7a11-9c3e-2f9a4d51b7e5
    action:
      type: string
      description: |
        What was done, as a stable identifier rather than a sentence. Free text would make the log
        unsearchable by action, which is how support uses it.
      example: administrator.created
    target_type:
      type: string
      description: |
        What kind of thing it was done to. Not a closed set: the trail outlives its subjects, so it
        has to be able to name a kind of thing that no longer exists.
      example: administrator
    target_id:
      type: string
      format: uuid
      description: |
        What it was done to. Deliberately not a foreign key in the schema — an entry outlives its
        subject — so nothing guarantees the row still exists, or ever did.
      example: 0198f2c1-6b40-7a11-9c3e-2f9a4d51b7e6
    reason:
      type: string
      description: |
        Why, where the action recorded one. Empty where it has none: creating an administrator has
        no reason beyond the act, and the actions that need one are refused without it.
      example: ''
    metadata:
      type: object
      additionalProperties: true
      description: |
        The extra facts the action recorded — the role granted, the standing set, the status a job
        moved to. Always an object, never `null`; `{}` where the action recorded nothing beyond
        itself.
      example:
        role: moderator
    created_at:
      type: string
      format: date-time
      description: |
        When the action committed, on the platform's clock, in UTC. Supplied by the service rather
        than by the column default, so an entry sorts correctly against the session, dispute and
        status-history rows it describes.
      example: '2026-08-14T09:00:00.000Z'

AdminJobUnpublish:
  post:
    operationId: adminUnpublishJob
    summary: Unpublish a policy-breaching job
    tags: [Administration]
    security:
      - BearerAdminSession: []
    parameters:
      - name: id
        in: path
        required: true
        description: The job to remove from the marketplace.
        schema:
          type: string
          format: uuid
      - $ref: '#/IdempotencyKey'
    description: |
      Docs/01 §4.6's third administrative capability — "remove or unpublish policy-breaching jobs"
      (SHIP-160) — with the reason it requires.

      ## Nothing is deleted, and that is why this is not a `DELETE`

      The job moves to `cancelled` through the one guarded transition every status change in this
      platform passes. Its status history records who moved it, when, and why; the row stays exactly
      where it was, because Docs/05 §3.1 keeps records. There is no `unpublished` status and no
      hidden flag — a second way for a job to be off the marketplace would be a second thing every
      feed, every eligibility query and every expiry sweep had to know about, and one of them would
      eventually not.

      ## Only before the job is awarded

      Docs/02 §2 permits `cancelled` from `draft`, `open` and `negotiating` — the statuses in which
      nobody is yet committed. **An awarded job cannot be unpublished**: a provider has committed and
      may have travelled, and Docs/02 §6.2 makes ending it after that a support case. The path is a
      dispute an administrator then resolves, which records both sides. That answers
      `admin_job_not_unpublishable`.

      A job somebody has already removed answers `admin_job_already_unpublished` instead — a
      different code, because the console's response is to reload and show who removed it rather
      than to offer the action again. On a queue two moderators are reading, this is the answer the
      second one gets.

      ## The reason is required, and it is recorded twice

      Not a formality: an empty string and a single character both satisfy a required field without
      recording anything, and this is the field a later reader has no way to reconstruct. Between 10
      and 500 characters after trimming; outside that it is a `422` naming `reason`.

      It is written into the job's **status history**, which is what a customer's support
      conversation reads, and into the **audit log**, which is what Docs/04 §9's controls read. The
      two answer different questions to different readers, and neither should have to find the other.

      ## The customer is notified, and no separate event arranges it

      The transition emits `job.status_changed` in the same transaction, and the notification rules
      already route a move to `cancelled` to the job's customer and the awarded provider. A second
      event announcing the same state change would mean two messages about one thing, which is worse
      than the second being redundant — a recipient who learns this platform emails twice starts
      ignoring the first one.

      The reason is **not** in that message. It is an administrator's internal note about a policy
      breach; what a customer is told is a copy decision belonging to whoever writes that template.

      ## Permission

      Needs `jobs.unpublish`, which `moderator` and `owner` hold and **`support` does not** — a
      support administrator may open any job and may not remove one. That split is Docs/04 §9's
      least-privilege control expressed as two permissions on two endpoints.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/UnpublishJobRequest'
    responses:
      '200':
        description: The job has been removed from the marketplace.
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestID'
        content:
          application/json:
            schema:
              $ref: '#/UnpublishJobResult'
      '400':
        $ref: '../openapi.yaml#/components/responses/BadRequest'
      '401':
        description: |
          No usable administrator session was presented.
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestID'
          WWW-Authenticate:
            description: The authentication scheme this endpoint accepts.
            schema:
              type: string
            example: Bearer error="invalid_token"
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Error'
      '403':
        description: |
          The session is valid and the role does not hold `jobs.unpublish`
          (`admin_permission_denied`). A `support` administrator gets this.
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestID'
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Error'
      '404':
        description: There is no such job (`not_found`).
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestID'
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Error'
      '409':
        description: |
          The job is past the point of being unpublishable
          (`admin_job_not_unpublishable`), or somebody has already removed it
          (`admin_job_already_unpublished`). Two codes rather than one, because the console's
          response differs: offer a dispute, or reload and show who removed it.
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestID'
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Error'
      '422':
        description: |
          The reason records nothing, or is longer than the field holds (`validation_failed`, with a
          `reason` entry in `error.details`).
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestID'
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Error'
      '500':
        $ref: '../openapi.yaml#/components/responses/InternalError'
      '503':
        description: |
          A dependency this request needs is not answering (`service_unavailable`).
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestID'
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Error'

UnpublishJobRequest:
  type: object
  additionalProperties: false
  required: [reason]
  description: |
    One field. There is no job identifier — it is in the path — and no actor: the administrator is
    whoever the credential says is calling, and a body that named its own actor would be an audit
    trail the client writes. Unknown fields are refused rather than ignored.
  properties:
    reason:
      type: string
      minLength: 10
      maxLength: 500
      description: |
        Why the job is being removed, measured after trimming. Recorded in the job's status history
        and in the audit log.
      example: Listing offers to transport a live animal, which Docs/05 prohibits.

UnpublishJobResult:
  type: object
  additionalProperties: false
  required: [job_id, status, reason]
  properties:
    job_id:
      type: string
      format: uuid
      example: 0198f2c1-6b40-7a11-9c3e-2f9a4d51b7e4
    status:
      type: string
      description: |
        Where the job is now. Always `Cancelled` — Docs/02 §1's stored form, consistently with every
        other administrative shape.
      example: Cancelled
    reason:
      type: string
      description: |
        What was recorded, read back so a console renders what the platform *stored* rather than
        what somebody typed. The two differ by trimming.
      example: Listing offers to transport a live animal, which Docs/05 prohibits.

AdminUserStanding:
  post:
    operationId: adminSetUserStanding
    summary: Restrict, suspend or reinstate an account
    tags: [Administration]
    security:
      - BearerAdminSession: []
    parameters:
      - name: id
        in: path
        required: true
        description: The account whose standing is changing.
        schema:
          type: string
          format: uuid
      - $ref: '#/IdempotencyKey'
    description: |
      Docs/01 §4.6's fourth administrative capability — "restrict or suspend accounts with a recorded
      reason" (SHIP-161).

      ## One endpoint for all three standings, reinstatement included

      `active`, `restricted` and `suspended` are one vocabulary, the permission to move between them
      is one permission, and the reason is required in **every** direction. A separate reinstate
      endpoint would be a second place for the reason to become optional — and a trail that records a
      restriction but not its reversal is the one that makes a person look permanently suspect.

      Setting the standing an account already holds is refused (`admin_user_standing_unchanged`)
      rather than recorded. An entry saying "changed from suspended to suspended" is noise in the one
      table whose value is that everything in it happened, and the right response is to reload —
      most often because another administrator got there first, which the audit trail will show.

      ## What each standing does, and where that is enforced

      - **`restricted`** limits the account without ending its access. A restricted provider may sign
        in and read and **may not bid**; a restricted account can still read the message explaining
        why it is restricted, which is the point of the standing existing at all.
      - **`suspended`** disables access. Sign-in is refused, and so is **session refresh** — which is
        where a suspension actually takes effect, because an access token lives fifteen minutes and
        deliberately carries no standing so that standing is read fresh.
      - **`active`** is an ordinary account.

      None of that enforcement is added by this endpoint; it has been in the identity domain since
      the account model was built. What this adds is the administrative act that sets the column,
      with the reason and the entry.

      Account standing is **not** provider verification, which is a separate eligibility decision
      with five states of its own (Docs/04 §4) and its own queue.

      ## Two-person review is not implemented

      Docs/04 §9 asks for "two-person review for permanent account suspension where practical".
      That is a separate ticket and there is deliberately no half of it here — no pending state and
      no approval field, because an administrator who sees a "pending approval" that nothing enforces
      believes there is a control.

      ## Permission

      Needs `users.restrict`, which `moderator` and `owner` hold and **`support` does not**. A
      support administrator may search accounts and may not change one.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/SetStandingRequest'
    responses:
      '200':
        description: The standing has changed.
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestID'
        content:
          application/json:
            schema:
              $ref: '#/StandingChangeResult'
      '400':
        $ref: '../openapi.yaml#/components/responses/BadRequest'
      '401':
        description: |
          No usable administrator session was presented.
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestID'
          WWW-Authenticate:
            description: The authentication scheme this endpoint accepts.
            schema:
              type: string
            example: Bearer error="invalid_token"
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Error'
      '403':
        description: |
          The session is valid and the role does not hold `users.restrict`
          (`admin_permission_denied`).
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestID'
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Error'
      '404':
        description: |
          There is no such account (`not_found`). Said plainly — the caller is an administrator
          holding a permission over accounts, so unlike the `404` on dispute intake there is nothing
          being kept from them.
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestID'
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Error'
      '409':
        description: |
          The account already holds that standing (`admin_user_standing_unchanged`).
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestID'
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Error'
      '422':
        description: |
          The standing is not one of the three, or the reason records nothing
          (`validation_failed`, with one `error.details` entry per field).
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestID'
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Error'
      '500':
        $ref: '../openapi.yaml#/components/responses/InternalError'
      '503':
        description: |
          A dependency this request needs is not answering (`service_unavailable`).
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestID'
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Error'

SetStandingRequest:
  type: object
  additionalProperties: false
  required: [standing, reason]
  description: |
    No account identifier — it is in the path. **No `from`**: what the account currently holds is
    read under a row lock rather than taken from a console that may have loaded the page five
    minutes ago.
  properties:
    standing:
      type: string
      enum: [active, restricted, suspended]
      description: What the account becomes.
      example: suspended
    reason:
      type: string
      minLength: 10
      maxLength: 500
      description: |
        Why, measured after trimming. Required in every direction, reinstatement included. Recorded
        in the audit log, which is append-only.
      example: Two unresolved no-shows in a fortnight; see the delivery exception queue.

StandingChangeResult:
  type: object
  additionalProperties: false
  required: [user_id, from, to, reason]
  description: |
    **Both ends, never just the new one.** A console rendering `restricted` cannot tell a reader
    whether that was a tightening or a loosening, and the same request performs all three
    directions.
  properties:
    user_id:
      type: string
      format: uuid
      example: 0198f2c1-6b40-7a11-9c3e-2f9a4d51b7e4
    from:
      type: string
      enum: [active, restricted, suspended]
      description: What the account held, read under the row lock at the moment of the change.
      example: active
    to:
      type: string
      enum: [active, restricted, suspended]
      description: What it holds now.
      example: suspended
    reason:
      type: string
      description: What was recorded, read back after trimming.
      example: Two unresolved no-shows in a fortnight; see the delivery exception queue.

AdminNotes:
  post:
    operationId: adminAddNote
    summary: Attach an internal support note to a user or a job
    tags: [Administration]
    security:
      - BearerAdminSession: []
    parameters:
      - $ref: '#/IdempotencyKey'
    description: |
      Docs/01 §4.6's fifth administrative capability — "add internal support notes" (SHIP-162).

      ## Notes are never user-visible, and that is structural rather than promised

      They live in a table of their own that **no user-facing endpoint reads and none joins**; both
      operations here require an administrator session, which is a separate credential system a user
      token cannot reach at all; and the note shape appears in these two responses and in no other
      response in this API. There is no field on a job, an account or a dispute that carries one, so
      a note cannot reach a customer by somebody widening a shape.

      The dispute table records the same decision from the other side: every column of a dispute is
      read straight back to the complainant, which is why notes were never a column on it.

      ## What a note attaches to

      A `user` or a `job` — **not an administrator**. A note about a colleague is a different thing
      with different handling; the record of what an administrator did is the audit trail, which
      nothing can rewrite.

      **The subject is not checked against its table.** A note may name a job or an account that no
      longer exists, and that is deliberate: a note outlives its subject (Docs/05 §3.1), and support
      writing up why an account was closed *after* it was closed is the case this table most exists
      for. An existence check would refuse exactly that note, and would buy a guarantee that stops
      holding a second later anyway.

      ## Notes are appended, not edited

      There is no `PATCH` and no `DELETE`. A support note is a contemporaneous record of what
      somebody knew at the time, and one that can be revised afterwards is worth less than one that
      cannot — in exactly the situation it exists for.

      That is a weaker guarantee than the audit trail's, which the database enforces by trigger, and
      the difference is deliberate: the audit trail holds administrators to account, while an
      operator correcting a note that names the wrong job is a legitimate act. The API offers no verb
      for it; the schema does not forbid one.

      ## Permission

      Needs `notes.write`, which `moderator` and `owner` hold and `support` does not. **Reading them
      needs less** — see the `GET` — and that asymmetry is the right way round: a support
      administrator reads the history and a moderator adds to it.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/AddNoteRequest'
    responses:
      '201':
        description: The note has been recorded.
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestID'
        content:
          application/json:
            schema:
              $ref: '#/AdminNote'
      '400':
        $ref: '../openapi.yaml#/components/responses/BadRequest'
      '401':
        description: |
          No usable administrator session was presented.
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestID'
          WWW-Authenticate:
            description: The authentication scheme this endpoint accepts.
            schema:
              type: string
            example: Bearer error="invalid_token"
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Error'
      '403':
        description: |
          The session is valid and the role does not hold `notes.write`
          (`admin_permission_denied`). A `support` administrator gets this, and may still read.
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestID'
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Error'
      '422':
        description: |
          The subject is not a user or a job, the subject identifier is missing or malformed, or the
          note records nothing (`validation_failed`, one `error.details` entry per field).
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestID'
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Error'
      '500':
        $ref: '../openapi.yaml#/components/responses/InternalError'
      '503':
        description: |
          A dependency this request needs is not answering (`service_unavailable`).
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestID'
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Error'
  get:
    operationId: adminReadNotes
    summary: Read the internal notes on one user or job
    tags: [Administration]
    security:
      - BearerAdminSession: []
    description: |
      Every note on one subject, newest first.

      ## The permission is the subject's, not a note permission

      A note on a `user` needs `users.read`; a note on a `job` needs `jobs.read`. Both are held by
      **every** administrator role including `support` — which is the role that most needs to read a
      support history and which deliberately cannot add to it.

      There is deliberately no `notes.read` permission. Notes never leave the console, so a
      permission gating this read would be one that every role holds and that never refuses
      anybody; what needs distinguishing is who may *add* one.

      ## Not paged

      The notes on one account or one job are tens at most and a console shows them all. The
      response carries `data` and nothing else — no cursor and no `has_more`, because publishing
      either would tell a client there is a paging mechanism when there is not.
    parameters:
      - name: subject_type
        in: query
        required: true
        description: What kind of thing the notes are about.
        schema:
          type: string
          enum: [user, job]
        example: user
      - name: subject_id
        in: query
        required: true
        description: |
          Which one. A subject with no notes answers `200` with an empty list rather than `404` —
          the subject is not looked up, so "no notes" and "no such subject" are the same answer
          here, and the caller establishes the second by opening the subject.
        schema:
          type: string
          format: uuid
        example: 0198f2c1-6b40-7a11-9c3e-2f9a4d51b7e4
    responses:
      '200':
        description: The notes on that subject, newest first.
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestID'
        content:
          application/json:
            schema:
              $ref: '#/AdminNoteList'
      '400':
        $ref: '../openapi.yaml#/components/responses/BadRequest'
      '401':
        description: |
          No usable administrator session was presented.
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestID'
          WWW-Authenticate:
            description: The authentication scheme this endpoint accepts.
            schema:
              type: string
            example: Bearer error="invalid_token"
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Error'
      '403':
        description: |
          The session is valid and the role does not hold the subject's read permission
          (`admin_permission_denied`). No role is in that position today — every role holds both —
          so this is the contract describing the check rather than a case a console will meet.
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestID'
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Error'
      '422':
        description: |
          The subject is not a user or a job, or its identifier is missing or malformed
          (`validation_failed`).
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestID'
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Error'
      '500':
        $ref: '../openapi.yaml#/components/responses/InternalError'
      '503':
        description: |
          A dependency this request needs is not answering (`service_unavailable`).
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestID'
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Error'

AddNoteRequest:
  type: object
  additionalProperties: false
  required: [subject_type, subject_id, body]
  description: |
    There is no author — the administrator is whoever the credential says is calling, and a body
    that named its own author would be a support history a client writes.
  properties:
    subject_type:
      type: string
      enum: [user, job]
      description: What the note is about.
      example: user
    subject_id:
      type: string
      format: uuid
      description: Which one. Not checked against its table — see the operation description.
      example: 0198f2c1-6b40-7a11-9c3e-2f9a4d51b7e4
    body:
      type: string
      minLength: 1
      maxLength: 4000
      description: |
        The note, measured after trimming. Generous compared with an action's `reason`, and
        deliberately: a reason is a sentence justifying an action and a note is prose about a
        situation.
      example: Rang about the damaged crates; sending photographs this afternoon.

AdminNote:
  type: object
  additionalProperties: false
  required: [id, subject_type, subject_id, author_id, body, created_at]
  description: |
    One internal support note. **This shape is returned by these two operations and by nothing else
    in this API** — that is how "never user-visible" is kept true.
  properties:
    id:
      type: string
      format: uuid
      example: 0198f2c1-6b40-7a11-9c3e-2f9a4d51b7e9
    subject_type:
      type: string
      enum: [user, job]
      example: user
    subject_id:
      type: string
      format: uuid
      example: 0198f2c1-6b40-7a11-9c3e-2f9a4d51b7e4
    author_id:
      type: string
      format: uuid
      description: |
        The administrator who wrote it, as an identifier. A name would be a second read of the
        administrator table, and a console listing notes already knows its own administrators.
      example: 0198f2c1-6b40-7a11-9c3e-2f9a4d51b7ea
    body:
      type: string
      description: The note, as it was stored — trimmed.
      example: Rang about the damaged crates; sending photographs this afternoon.
    created_at:
      type: string
      format: date-time
      description: |
        When it was written, in UTC, on the platform's clock — the same clock the audit entry
        describing it takes, so the two sort together.
      example: '2026-08-15T09:12:00.000Z'

AdminNoteList:
  type: object
  additionalProperties: false
  required: [data]
  description: |
    **Not the standard collection envelope**, deliberately: there is no `next_cursor` and no
    `has_more`, because this read does not page and publishing either would describe a mechanism
    that does not exist. `data` is kept so the shape can grow into the envelope if it ever does.
  properties:
    data:
      type: array
      description: The notes, newest first. Always an array, never `null`.
      items:
        $ref: '#/AdminNote'
