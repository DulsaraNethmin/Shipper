# Admin — support, moderation, disputes and the audit trail.
#
# The counterpart of cmd/api/routes_admin.go. Docs/10 §8.1 keeps the two in step: a domain adds one
# route file and one fragment, and edits neither this file's siblings nor the middle of a shared
# document. The one shared line per path is its $ref in contracts/openapi.yaml.
#
# Response schemas are `additionalProperties: false` throughout. Docs/07 §6 requires *clients* to
# tolerate fields they do not recognise, which is a rule about client behaviour and not a licence for
# the contract to describe less than the service returns.
#
# # The one operation here today is called by a customer or a provider, not by an administrator
#
# Worth stating first, because the domain's name invites the opposite assumption. Docs/04 §7 has
# three stages — intake, investigation, outcome — and only the first belongs to the parties. Intake
# takes the ordinary mobile access token and is somebody reporting that their own delivery went
# wrong.
#
# Administrator sign-in is a separate system that a user token can never reach (SHIP-147), and the
# administrative stages arrive with it at SHIP-164. Nothing in this fragment can be reached with an
# administrator's credential, and nothing an administrator writes appears in any shape below —
# internal notes (SHIP-162) are never user-visible, and every field here is read straight back to the
# complainant.
#
# # There is no field for whose job and none for who is complaining
#
# The job is named in the path and the complainant is whoever the token says is calling. Which side
# of the job they were on is resolved by the platform from the job and its accepted bid; a
# `complainant` in a request body would be an authorisation decision made from client input, which
# Docs/07 §3 puts on the platform.

Disputes:
  post:
    operationId: raiseDispute
    summary: Raise a dispute about a job
    tags: [Disputes]
    security:
      - BearerAccessToken: []
    description: |
      Records what went wrong on a delivery and freezes the job while it is looked at (SHIP-163).
      This is the intake stage of Docs/04 §7.

      Only a party to the job may call it: the customer who owns it, or the provider whose bid was
      accepted. Everybody else — a provider who bid and lost, a customer looking at somebody else's
      job, an account with no connection to it at all — gets the same `404` a job that does not
      exist gets. Which jobs exist, who won them, and what is going wrong on them is commercial
      information nobody published.

      ## Raising a dispute freezes the job

      The job moves to `disputed` in the same transaction, which is what stops the 72-hour
      auto-complete running through the middle of an unresolved complaint (Docs/02 §3, §6.1). It is
      the only thing that does: there is no separate "pause" and no client-side hold.

      A dispute can therefore only be raised while there is a delivery to dispute — from `awarded`
      through `delivered`. A job still open for bids is cancelled rather than disputed, and a job
      that has completed or been cancelled has left the lifecycle; both answer
      `admin_job_not_disputable`.

      The job is unfrozen by an administrator resolving the dispute, which is not yet built.

      ## What to send

      ```json
      {
        "category": "goods_damaged_or_missing",
        "description": "Two of the four crates arrived with the sides staved in.",
        "desired_outcome": "A record of the damage, and the provider contacted about it.",
        "occurred_at": "2026-08-11T15:40:00Z",
        "evidence": ["Photographed the crates at the depot", "The driver's message of 11/08"]
      }
      ```

      **`occurred_at` is when the problem happened, not when you are reporting it**, and it is
      required for that reason. The platform records the filing time itself; if this defaulted, a
      complaint filed on Thursday about Tuesday's delivery would be stored as having happened on
      Thursday, and nothing afterwards could tell that value from one somebody meant. Send the
      incident's time even when it is the same as now.

      A time in the past is accepted however far back it goes. A time in the future is refused.

      ## One open dispute per job

      A job is frozen once. While a dispute is waiting on an outcome, a second one — including one
      raised by the *other* party to the same delivery — is refused with `admin_dispute_already_open`
      rather than queued behind it. Once it is resolved the job can be disputed again, so a job may
      accumulate disputes over its life while never having two open at once.

      ## Retrying

      **A retry** reuses its `Idempotency-Key`. It answers `200` with the dispute the first attempt
      raised, and writes nothing — whether the retry arrives a second later or a day later, because
      the guarantee is a unique index in the database rather than a cached response. Retry as often
      as a dropped connection requires.

      Reusing one key for a *different* complaint is refused with `idempotency_key_reused`. One key
      per action.
    parameters:
      - $ref: '#/JobID'
      - $ref: '#/IdempotencyKey'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/DisputeIntake'
    responses:
      '201':
        description: |
          The dispute is recorded and the job is now `disputed`.
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestID'
        content:
          application/json:
            schema:
              $ref: '#/Dispute'
      '200':
        description: |
          This `Idempotency-Key` had already raised this dispute. Nothing was written and the
          original is returned — the same shape as `201`, so a client that does not care which
          happened parses one type.
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestID'
        content:
          application/json:
            schema:
              $ref: '#/Dispute'
      '400':
        $ref: '../openapi.yaml#/components/responses/BadRequest'
      '401':
        $ref: '../openapi.yaml#/components/responses/Unauthenticated'
      '404':
        $ref: '../openapi.yaml#/components/responses/NotFound'
      '409':
        description: |
          One of four, and they lead to four different places:

          | `error.code` | What happened |
          |---|---|
          | `admin_job_not_disputable` | The job has not been awarded yet, or has already completed or been cancelled. Reload it |
          | `admin_dispute_already_open` | Somebody has already raised a dispute on this job and it is waiting on an outcome. Show that one |
          | `idempotency_key_reused` | This key already raised a *different* dispute on this job. Generate a new one |
          | `idempotency_request_in_progress` | An identical request is still being handled. Retry in a moment |
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestID'
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Error'
      '422':
        description: |
          One or more fields were rejected (`validation_failed`). `error.details` carries one entry
          per field, with the JSON path the client sent — including `evidence.0` for the offending
          entry in the list.
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestID'
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Error'
      '500':
        $ref: '../openapi.yaml#/components/responses/InternalError'
      '503':
        description: |
          A dependency this request needs is not answering (`service_unavailable`).
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestID'
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Error'

# --- schemas ---------------------------------------------------------------------------------

DisputeIntake:
  type: object
  additionalProperties: false
  required: [category, description, desired_outcome, occurred_at]
  description: |
    Docs/04 §7's intake fields, minus the two the platform supplies. The job is in the path and the
    complainant is the token. Unknown fields are refused, so a client typo fails loudly rather than
    being silently ignored.
  properties:
    category:
      type: string
      enum:
        - provider_fails_to_arrive
        - goods_differ_from_listing
        - customer_unavailable
        - delivery_is_late
        - goods_damaged_or_missing
        - other
      description: |
        What the dispute is about. The list is derived from Docs/02 §5's exception scenarios — the
        things that actually go wrong on a delivery — with `other` for everything nobody
        anticipated. Filing under `other` with a good description is better than filing under the
        nearest wrong heading; an administrator triages from this field.
      example: goods_damaged_or_missing
    description:
      type: string
      minLength: 1
      maxLength: 4000
      description: |
        What happened, in your own words. Generous in length because this is somebody describing an
        incident that may have cost them a day, not a note attached to a milestone.
      example: Two of the four crates arrived with the sides staved in.
    desired_outcome:
      type: string
      minLength: 1
      maxLength: 1000
      description: |
        What you want done about it. Shipper records outcomes and supports resolution; for the MVP
        it does not promise compensation or adjudicate liability (Docs/04 §7), so this is what the
        administrator works towards rather than what they are obliged to deliver.
      example: A record of the damage, and the provider contacted about it.
    occurred_at:
      type: string
      format: date-time
      description: |
        RFC 3339. **When the problem happened**, not when you are reporting it — the platform
        records the filing time itself, and the two are frequently days apart.

        Required. A default would put the report's time in the incident's field on every request
        that omitted it, and nothing afterwards could tell that value from one somebody meant.

        Not bounded backwards: a complaint about a delivery a month ago is still a complaint. A time
        in the future is refused.
      example: '2026-08-11T15:40:00Z'
    evidence:
      type: array
      maxItems: 20
      items:
        type: string
        minLength: 1
        maxLength: 500
      description: |
        What you have that supports this, described in your own words — "photographed the crates at
        the depot", "the driver's message of 11/08".

        **These are references, not uploads.** Attaching a file is not built: verification evidence
        and delivery proof both upload to private object storage through short-lived pre-signed URLs
        (Docs/04 §3.1), and neither path exists yet. The platform stores what you write here and
        does not resolve it. When uploads arrive they will be attachments alongside this list rather
        than a change to it.

        Optional, and an empty list is the same as omitting it.
      example:
        - Photographed the crates at the depot
        - The driver's message of 11/08

Dispute:
  type: object
  additionalProperties: false
  required:
    [id, job_id, raised_by, category, description, desired_outcome, evidence, occurred_at, raised_at]
  description: |
    One dispute, as its complainant sees it.

    **The job's status is deliberately not here.** A successful response means the job is `disputed`
    and nothing else; repeating the status would be a second copy of a vocabulary the jobs endpoints
    own.

    **Nothing an administrator writes appears here, and nothing ever will.** Internal support notes
    are never user-visible (SHIP-162), and the administrative view of a dispute is a shape of its own
    rather than this one reached by another route.
  properties:
    id:
      type: string
      format: uuid
      description: The dispute's identifier, and what the administrative workflow refers to it by.
      example: 0198f2c1-6b40-7a11-9c3e-2f9a4d51b7e3
    job_id:
      type: string
      format: uuid
      example: 0198f2c1-6b40-7a11-9c3e-2f9a4d51b7e1
    raised_by:
      type: string
      enum: [customer, provider]
      description: |
        Which side of the job the platform decided you were on, not who you are. It is resolved from
        the job and its accepted bid rather than from the role on your account — being the customer
        who owns *this* job is a different fact from having a customer account.
      example: customer
    category:
      type: string
      enum:
        - provider_fails_to_arrive
        - goods_differ_from_listing
        - customer_unavailable
        - delivery_is_late
        - goods_damaged_or_missing
        - other
      example: goods_damaged_or_missing
    description:
      type: string
      example: Two of the four crates arrived with the sides staved in.
    desired_outcome:
      type: string
      example: A record of the damage, and the provider contacted about it.
    evidence:
      type: array
      items:
        type: string
      description: |
        What was described at intake, in the order it was sent. Always present; an empty list rather
        than `null` when nothing was described.
      example:
        - Photographed the crates at the depot
    occurred_at:
      type: string
      format: date-time
      description: |
        When the complainant says the problem happened, in UTC. Exactly what was sent, uncorrected.
      example: '2026-08-11T15:40:00.000Z'
    raised_at:
      type: string
      format: date-time
      description: |
        When the platform received the report, in UTC, on the platform's clock. A client that
        renders only this is showing a filing time as though it were the incident.
      example: '2026-08-13T02:15:30.000Z'

# --- parameters ------------------------------------------------------------------------------

JobID:
  name: id
  in: path
  required: true
  description: The job's identifier.
  schema:
    type: string
    format: uuid
  example: 0198f2c1-6b40-7a11-9c3e-2f9a4d51b7e1

IdempotencyKey:
  name: Idempotency-Key
  in: header
  required: true
  description: |
    A client-generated value, one per action, reused for every retry of that action. Every
    state-changing request carries one and is refused without it (SHIP-15) — a phone that retries
    after a dropped connection must not raise the same complaint twice.
  schema:
    type: string
    maxLength: 255
  example: 6c1f2ab4-6f2a-4f0c-8b0e-9a53c1f21b8d

# --- administrator authentication (SHIP-147) ---------------------------------------------------
#
# Everything above this line is called by a customer or a provider. Everything below it is called
# by an administrator, with a credential the mobile system cannot produce and cannot verify.
#
# **The credential is `BearerAdminSession` and it is not a JWT.** The reasoning is on the scheme
# itself in openapi.yaml: it is a row rather than a signature, so a sign-out and a role change both
# take effect on the next request. What that costs a client is nothing — it is a bearer token in the
# ordinary header — and what it buys is that "this administrator has been stood down" is true
# immediately.

AdminSessions:
  post:
    operationId: adminSignIn
    summary: Sign in to the administration console
    tags: [Administration]
    security: []
    description: |
      Exchanges an administrator's email address and password for a console session (SHIP-147).

      **This is a different account system from `/v1/auth/login`.** An administrator has no `users`
      row, no mobile session and no role from the customer/provider vocabulary; a person who is both
      an administrator and a marketplace user has two accounts with two passwords, and neither
      credential can be used where the other belongs.

      ## What you get back

      ```json
      {
        "token": "…",
        "session": {"id": "0198…", "expires_at": "2026-08-14T14:12:00.000Z"},
        "administrator": {"id": "0198…", "email": "moderator@example.com",
                          "name": "Sam Okafor", "role": "moderator",
                          "created_at": "2026-07-01T09:00:00.000Z"}
      }
      ```

      **`token` is shown once and is never readable again.** The platform stores a hash of it, so
      there is no endpoint that returns it and no way to recover it — a console that loses it signs
      in again.

      Send it as a `Bearer` credential in the standard HTTP credential header, on every
      administrative request.

      ## How long it lasts

      `expires_at` is when the credential stops working, and it moves. The session slides forward
      while the console is being used and ends after **thirty minutes of inactivity** or **twelve
      hours in total**, whichever comes first — so `expires_at` is the earlier of the two and is
      worth re-reading from `GET /v1/admin/me` rather than caching from sign-in.

      There is no refresh endpoint. When it ends, sign in again.

      ## When it is refused

      | Status | `error.code` | What happened |
      |---|---|---|
      | `400` | `admin_credentials_invalid` | The address and password do not match an administrator account |
      | `403` | `admin_account_disabled` | The password was right and the account is out of service |
      | `429` | `rate_limited` | Too many attempts. `Retry-After` says when |

      **`admin_credentials_invalid` is deliberately one answer for two cases** — no such
      administrator, and the wrong password — and the platform spends the same amount of work on
      both, so the response time does not disclose what the status code will not. Which addresses
      are administrators is not something an unauthenticated caller may find out.
    parameters:
      - $ref: '#/IdempotencyKey'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/AdminSignIn'
    responses:
      '200':
        description: |
          Signed in. The token is in the body and will not be shown again.
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestID'
        content:
          application/json:
            schema:
              $ref: '#/AdminSignInResult'
      '400':
        description: |
          Either the request could not be understood, or the credentials do not match
          (`admin_credentials_invalid`). The two are distinguishable by `error.code` and nothing
          else about the failed sign-in is explained.
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestID'
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Error'
      '403':
        description: |
          The password was correct and the account has been disabled (`admin_account_disabled`).
          Signing in again will not help; the account has to be restored.
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestID'
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Error'
      '409':
        description: |
          This `Idempotency-Key` has already been used for a different request
          (`idempotency_key_reused`), or an identical one is still in flight
          (`idempotency_request_in_progress`).
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestID'
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Error'
      '422':
        description: |
          One or more fields were rejected (`validation_failed`), with one `error.details` entry
          per field.
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestID'
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Error'
      '429':
        description: |
          Too many sign-in attempts, counted per account and per network address (`rate_limited`).
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestID'
          Retry-After:
            description: Seconds to wait before trying again.
            schema:
              type: integer
            example: 24
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Error'
      '500':
        $ref: '../openapi.yaml#/components/responses/InternalError'
      '503':
        description: |
          A dependency this request needs is not answering (`service_unavailable`). The rate
          limiter is one of them: it **fails closed**, so an unreachable cache refuses sign-ins
          rather than serving them unlimited.
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestID'
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Error'

AdminCurrentSession:
  delete:
    operationId: adminSignOut
    summary: End the administrator session you are presenting
    tags: [Administration]
    security:
      - BearerAdminSession: []
    description: |
      Ends this session and no other (SHIP-147). The credential stops working immediately — it is a
      row rather than a signature, so there is no window in which a signed-out token is still
      accepted.

      **There is no way to name somebody else's session.** Signing another machine out is a feature
      with an authorisation question behind it and has not been built.

      **Safe to repeat**, in the way that matters to a browser on a poor connection: retry with the
      same `Idempotency-Key` and the original `204` is replayed, without the credential being
      consulted again.

      A *fresh* key on the same credential answers `401` instead, because the session it names has
      already ended — which is the honest answer rather than a second success for something that
      did not happen.
    parameters:
      - $ref: '#/IdempotencyKey'
    responses:
      '204':
        description: The session is over.
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestID'
      '400':
        $ref: '../openapi.yaml#/components/responses/BadRequest'
      '401':
        description: |
          No usable administrator session was presented. `admin_session_expired` means the session
          was genuine and has ended — sign in again; `unauthenticated` means the credential was not
          recognised at all.
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestID'
          WWW-Authenticate:
            description: The authentication scheme this endpoint accepts.
            schema:
              type: string
            example: Bearer error="invalid_token"
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Error'
      '409':
        description: |
          This `Idempotency-Key` has already been used for a different request
          (`idempotency_key_reused`), or an identical one is still in flight
          (`idempotency_request_in_progress`).
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestID'
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Error'
      '500':
        $ref: '../openapi.yaml#/components/responses/InternalError'
      '503':
        description: |
          A dependency this request needs is not answering (`service_unavailable`).
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestID'
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Error'

AdminMe:
  get:
    operationId: adminMe
    summary: Who this administrator session belongs to
    tags: [Administration]
    security:
      - BearerAdminSession: []
    description: |
      The console's first call after signing in and after every reload (SHIP-147).

      It answers two questions: who am I, and how long is this credential good for. Both come from
      the session row the platform reads to authenticate the request, so the answer is current
      rather than whatever was true at sign-in — an administrator whose role changed a minute ago
      sees the new one here.

      **`session.expires_at` moves.** The session slides forward as the console is used, so this is
      the endpoint to re-read it from rather than caching the value sign-in returned.
    responses:
      '200':
        description: The administrator this session belongs to.
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestID'
        content:
          application/json:
            schema:
              $ref: '#/AdminMeResult'
      '401':
        description: |
          No usable administrator session was presented. `admin_session_expired` means it ended;
          `unauthenticated` means it was never valid, or the account behind it has been disabled —
          the platform does not distinguish those two to somebody holding only a token.
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestID'
          WWW-Authenticate:
            description: The authentication scheme this endpoint accepts.
            schema:
              type: string
            example: Bearer error="invalid_token"
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Error'
      '500':
        $ref: '../openapi.yaml#/components/responses/InternalError'
      '503':
        description: |
          A dependency this request needs is not answering (`service_unavailable`).
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestID'
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Error'

AdminAdministrators:
  post:
    operationId: createAdministrator
    summary: Create an administrator account
    tags: [Administration]
    security:
      - BearerAdminSession: []
    description: |
      Adds an administrator (SHIP-147, SHIP-148).

      **Needs the `admins.manage` permission**, which only the `owner` role holds. Somebody who can
      create an administrator can create one with any role, so this is the endpoint the whole
      permission model exists to protect; `support` and `moderator` sessions get `403`
      `admin_permission_denied`.

      ## `role` is optional, and leaving it out is not an error

      An account created without one becomes `support` — the least-privileged role, which can read
      the console and change nothing. It does **not** inherit the creator's role and it is not
      refused. That is deliberate: a forgotten field should produce the account that can do least.

      Sending a role the platform does not have *is* an error (`422`, naming `role`), because that is
      a different mistake — a client that believes in a role which does not exist would otherwise be
      handed the minimum without being told.

      ## There is no bootstrap through this endpoint

      The first administrator in a deployment is created by an operator with a database insert. An
      "allow anybody while the table is empty" branch would be an unauthenticated account-creation
      endpoint for every deployment's first minute.

      ## The password

      Set by whoever creates the account and handed over out of band; there is no invitation email
      and no reset flow yet. Twelve characters is the floor.
    parameters:
      - $ref: '#/IdempotencyKey'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/NewAdministrator'
    responses:
      '201':
        description: |
          The account exists. `role` in the response is what was actually applied, which is worth
          reading — it is `support` whenever the request did not say otherwise.
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestID'
        content:
          application/json:
            schema:
              $ref: '#/Administrator'
      '400':
        $ref: '../openapi.yaml#/components/responses/BadRequest'
      '401':
        description: |
          No usable administrator session was presented.
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestID'
          WWW-Authenticate:
            description: The authentication scheme this endpoint accepts.
            schema:
              type: string
            example: Bearer error="invalid_token"
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Error'
      '403':
        description: |
          The session is valid and the role does not hold `admins.manage`
          (`admin_permission_denied`). The message names no permission — ask whoever administers the
          platform rather than probing for the list.
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestID'
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Error'
      '409':
        description: |
          An administrator already exists with that address (`admin_email_taken`), or the
          `Idempotency-Key` has been used for a different request.
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestID'
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Error'
      '422':
        description: |
          One or more fields were rejected (`validation_failed`), with one `error.details` entry per
          field — including `role` for a role the platform does not have.
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestID'
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Error'
      '500':
        $ref: '../openapi.yaml#/components/responses/InternalError'
      '503':
        description: |
          A dependency this request needs is not answering (`service_unavailable`).
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestID'
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Error'

# --- administration schemas --------------------------------------------------------------------

NewAdministrator:
  type: object
  additionalProperties: false
  required: [email, name, password]
  properties:
    email:
      type: string
      minLength: 3
      maxLength: 320
      description: |
        Case-insensitive, and unique among administrators. It may also be a marketplace account's
        address — the two systems are unrelated and neither implies the other.
      example: sam@example.com
    name:
      type: string
      minLength: 1
      maxLength: 200
      description: Who this is, as the audit trail will record them.
      example: Sam Okafor
    password:
      type: string
      minLength: 12
      maxLength: 512
      description: |
        The initial password, handed over out of band. There is no invitation email and no reset
        flow yet.
      example: correct-horse-battery-staple
    role:
      type: string
      enum: [support, moderator, owner]
      description: |
        **Optional. Omitting it gives `support`**, the least-privileged role — not the creator's,
        and not a refusal.

        A value outside the list is refused rather than minimised, because sending nothing and
        sending a role that does not exist are different mistakes.
      example: moderator

AdminSignIn:
  type: object
  additionalProperties: false
  required: [email, password]
  description: |
    An administrator's credentials. There is no device label: the console has no device list to
    show one in, and a name supplied by the client and never checked would be an unauthenticated
    string in the audit trail.
  properties:
    email:
      type: string
      minLength: 3
      maxLength: 320
      description: |
        Case-insensitive. This is the administrator account's address, which may or may not also be
        a marketplace account — the two are unrelated.
      example: moderator@example.com
    password:
      type: string
      description: |
        Sent as typed. Leading and trailing spaces are significant, because they may be characters
        somebody chose.
      example: correct-horse-battery-staple

AdminSignInResult:
  type: object
  additionalProperties: false
  required: [token, session, administrator]
  properties:
    token:
      type: string
      description: |
        The session credential, sent as a `Bearer` credential in the standard HTTP credential
        header. The `BearerAdminSession` scheme in the root document names it.

        **Shown once.** The platform stores only a hash of it, so nothing can return it again.
      example: 9dW3nP1qTzR7lK0sYbV2xC8gH4jM6oA5eF1uI3rQ7wY
    session:
      $ref: '#/AdminSession'
    administrator:
      $ref: '#/Administrator'

AdminMeResult:
  type: object
  additionalProperties: false
  required: [administrator, session]
  properties:
    administrator:
      $ref: '#/Administrator'
    session:
      $ref: '#/AdminSession'

AdminSession:
  type: object
  additionalProperties: false
  required: [id, expires_at]
  description: |
    The console session this request is being served under.
  properties:
    id:
      type: string
      format: uuid
      description: |
        Which sign-in this is. An administrator signed in on two machines has two sessions, and
        signing out ends only the one whose credential was presented.
      example: 0198f2c1-6b40-7a11-9c3e-2f9a4d51b7e3
    expires_at:
      type: string
      format: date-time
      description: |
        When this credential stops working, in UTC — the earlier of the idle limit and the absolute
        one. **It moves**: using the console pushes the idle limit forward, and never past the
        absolute one. Only one figure is published, because a client that computed the answer from
        two would get it wrong on the day either constant changes.
      example: '2026-08-14T14:12:00.000Z'

Administrator:
  type: object
  additionalProperties: false
  required: [id, email, name, role, permissions, created_at]
  description: |
    An administrator account.

    **There is no status field.** An account that is not active cannot sign in and cannot hold a
    session, so a status here would read `active` on every account the console can reach — which is
    exactly the kind of field a client eventually branches on and is wrong about.
  properties:
    id:
      type: string
      format: uuid
      description: |
        The administrator's identifier. This is what the audit trail records as the actor, and it is
        **not** a `users` id — the two tables are unrelated and their identifiers are not
        interchangeable.
      example: 0198f2c1-6b40-7a11-9c3e-2f9a4d51b7e0
    email:
      type: string
      example: moderator@example.com
    name:
      type: string
      description: Who this is, as support and the audit trail refer to them.
      example: Sam Okafor
    role:
      type: string
      enum: [support, moderator, owner]
      description: |
        The named bundle of permissions this administrator holds, listed least privileged first.

        - `support` — read only: search users and jobs, read the queues, read a dispute, read the
          audit trail. This is what an account with no role stated becomes.
        - `moderator` — support, plus acting on what it can see.
        - `owner` — moderator, plus managing administrator accounts.
      example: moderator
    permissions:
      type: array
      items:
        type: string
      description: |
        What this role holds, expanded, sorted. Published so the console can **hide what it may not
        do** — and never so it can decide: every endpoint checks the permission against the role in
        the session row on each request, so editing this list in a response changes nothing.

        Sent expanded rather than left for a client to derive from `role`, because a derivation is a
        second copy of the mapping in TypeScript, and it is the copy that drifts — nothing fails
        when a console shows a button that answers `403`.

        Always present. An empty list is a real answer, not an error.
      example:
        - audit.read
        - disputes.read
        - jobs.read
        - moderation.read
        - users.read
        - verifications.read
    created_at:
      type: string
      format: date-time
      example: '2026-07-01T09:00:00.000Z'
