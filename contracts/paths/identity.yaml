# Registration, verification and credentials — the identity domain.
#
# The counterpart of cmd/api/routes_identity.go. Docs/10 §8.1 keeps the two in step: a domain
# adds one route file and one fragment, and edits neither this file's siblings nor the middle of
# a shared document. The one shared line per path is its $ref in contracts/openapi.yaml.
#
# Response schemas are `additionalProperties: false` throughout. Docs/07 §6 requires *clients* to
# tolerate fields they do not recognise, which is a rule about client behaviour and not a licence
# for the contract to describe less than the service returns.
#
# # Which operations here are public, and why
#
# Everything up to and including sign-in is: each is how a caller obtains their own credentials,
# which is the one justification cmd/api's publicMutatingRoutes allow-list accepts. An endpoint
# that takes a verification token sent to an address cannot itself require the session that
# verifying the address leads to.
#
# From SHIP-43 the domain also has operations that require one — sign-out and the device list —
# and they carry a `security` block naming `BearerAccessToken`. They answer `401` with a
# `WWW-Authenticate` challenge, which is the other half of the rule sign-in states: a credential
# in the request body is refused with `400`, a credential in the bearer header with `401`.
#
# Every state-changing operation requires `Idempotency-Key`. A phone that retries after a dropped
# connection must not end up with two accounts, or with a duplicate-address error for the account
# it just created.

Register:
  post:
    operationId: register
    summary: Create an unverified account
    tags: [Identity]
    description: |
      Creates an account with the role it will keep (SHIP-30, SHIP-45).

      Both contact channels start unverified. Docs/04 §2 requires email and phone verified
      before a customer may publish, and Docs/01 §4.1 allows drafts before then — so an
      unverified account is a state the product has a use for, not an intermediate one.

      **The role is fixed here and cannot be changed afterwards.** A provider's bid history
      and a customer's job history are not interchangeable, so changing role means a new
      account. The rule is enforced by a database trigger, not by application logic alone.

      **No token is returned.** Registering is not signing in: `POST /v1/auth/login` (SHIP-41)
      issues the first access token, after the password has been presented at the endpoint that
      exists to take it.

      ## Duplicates

      A duplicate email or mobile number is refused with `identity_email_taken` or
      `identity_phone_taken`. This is the one place the platform tells an unauthenticated caller
      whether an address is known; the resend and OTP endpoints deliberately do not, because
      there the disclosure buys the caller nothing.
    parameters:
      - $ref: '#/IdempotencyKey'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [email, phone, password, role]
            additionalProperties: false
            properties:
              email:
                type: string
                format: email
                maxLength: 254
                description: Stored case-insensitively; `Alice@Example.com` and `alice@example.com` are one account.
                example: alice@example.com
              phone:
                type: string
                description: |
                  An Australian mobile number in any of the forms a person types it. It is
                  normalised to E.164 before storage, so `0412 345 678` and `+61412345678` are
                  one account. A number that already carries a country code is left alone.
                example: '0412 345 678'
              password:
                type: string
                minLength: 10
                maxLength: 128
                description: |
                  Length is the only rule (NIST SP 800-63B). Composition requirements produce
                  `Password1!` — a narrower search space and a harder password to remember.
                example: correct-horse-battery-staple
              role:
                type: string
                enum: [customer, provider]
                description: |
                  Fixed at registration and immutable afterwards. `admin` is not a value here:
                  administrators sign in through a separate system (SHIP-147).
                example: customer
    responses:
      '201':
        description: The account was created.
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestID'
        content:
          application/json:
            schema:
              $ref: '#/Account'
      '400':
        $ref: '../openapi.yaml#/components/responses/BadRequest'
      '409':
        description: |
          The email address or the mobile number already has an account —
          `identity_email_taken` or `identity_phone_taken`.
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestID'
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Error'
      '422':
        description: One or more fields were rejected. `details` names each of them.
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestID'
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Error'
      '500':
        $ref: '../openapi.yaml#/components/responses/InternalError'
      '503':
        description: The database was not reachable. Retry; this is transient by construction.
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestID'
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Error'

Login:
  post:
    operationId: signIn
    summary: Exchange a password for a device session
    tags: [Identity]
    description: |
      Verifies the password and starts a device session, returning the first token pair
      (SHIP-41).

      This is where a session begins. Every later call in the identity domain either exchanges
      that session's refresh token (`/v1/auth/refresh`) or ends it (`/v1/auth/logout`,
      `DELETE /v1/auth/sessions/{id}`).

      ## Each sign-in creates a device

      There is no device identifier to match on, so signing in twice from one handset produces
      two entries in `GET /v1/auth/sessions`. **Sign in once and hold the refresh token**
      (Docs/07 §3): a client that signs in again rather than refreshing leaves the previous
      session live for thirty days and shows its owner a device list they cannot make sense of.

      `device_label` is what that list displays. Send something a person will recognise — the
      handset's model name if they have not been asked for one.

      ## Failures

      One code, `identity_credentials_invalid`, for an address with no account **and** for the
      wrong password against a real one. The remedy is the same, and two answers would let
      anybody find out which addresses have accounts without holding any credential. The
      platform also spends the same password-hashing work on both paths, so the response time
      does not disclose what the status code withholds.

      **It answers `400`, not `401`**, which is the rule across this domain: a credential
      presented in the request body is refused with `400`, and a credential presented in the
      bearer header with `401`. A `401` here would need a `WWW-Authenticate` challenge
      describing a scheme this endpoint does not accept, and would send a client interceptor
      that refreshes on `401` around its loop a second time.

      `identity_account_suspended` is the one exception, and it is a `403`. It is said only
      after the password verified — the caller has just proved they own the account they are
      being told about.

      ## Throttling

      Repeated **failures** are limited, per account and per network address (SHIP-47). A
      successful sign-in costs nothing, so somebody who knows their password is never refused
      for using it.

      Reaching either limit answers `429` with `Retry-After`, and does so **before** the
      password is checked — so a correct password is refused too while the limit holds. Wait
      the header out rather than retrying; retrying while refused does not extend the wait, but
      it does not shorten it either.
    parameters:
      - $ref: '#/IdempotencyKey'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [email, password, device_label]
            additionalProperties: false
            properties:
              email:
                type: string
                format: email
                maxLength: 254
                description: Matched case-insensitively, as it is stored.
                example: alice@example.com
              password:
                type: string
                description: |
                  Checked for presence only. The length rule at registration is about what may
                  be chosen, and applying it here would refuse an account whose password
                  predates the current floor.
                example: correct-horse-battery-staple
              device_label:
                type: string
                minLength: 1
                maxLength: 120
                description: |
                  Display text for the device list. It authenticates nothing, and two handsets
                  may legitimately carry the same label.
                example: Nethmin's iPhone
    responses:
      '200':
        description: The password verified and a device session was created.
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestID'
        content:
          application/json:
            schema:
              $ref: '#/TokenPair'
      '400':
        description: |
          The address and password do not match an account — `identity_credentials_invalid`.
          Deliberately the same answer for an address with no account.
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestID'
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Error'
      '403':
        description: |
          The password was right and the account is suspended — `identity_account_suspended`.
          Contact support; retrying will not help.
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestID'
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Error'
      '422':
        description: One or more fields were rejected. `details` names each of them.
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestID'
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Error'
      '500':
        $ref: '../openapi.yaml#/components/responses/InternalError'
      '503':
        description: The database was not reachable. Retry; this is transient by construction.
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestID'
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Error'

Logout:
  post:
    operationId: signOut
    summary: End the device session this token belongs to
    tags: [Identity]
    security:
      - BearerAccessToken: []
    description: |
      Revokes the device session the access token was issued against, and no other (SHIP-43).

      **Which session ends is decided by the token, not by the request.** There is nothing to
      send: the `sid` claim names the device the call came from. Ending a session on a device
      you are not holding is `DELETE /v1/auth/sessions/{id}`, which checks that the session is
      yours.

      Signing out on one device leaves every other device signed in. A person signing out at a
      shared terminal must not lose the session on the phone in their pocket.

      ## After this call

      The refresh token on this device stops working immediately. The access token keeps
      verifying until it expires — it is signed rather than looked up — so a client must
      discard both rather than relying on the platform to refuse the one it still holds. That
      window is the fifteen minutes in `expires_in` and is the price of not doing a database
      read on every request.

      ## It always succeeds

      A session already revoked, and a token naming a session that no longer exists, both answer
      `204`. The client is discarding its tokens either way, and a failure here would only leave
      somebody on a screen they cannot get past.
    parameters:
      - $ref: '#/IdempotencyKey'
    responses:
      '204':
        description: The session is ended. No body.
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestID'
      '400':
        $ref: '../openapi.yaml#/components/responses/BadRequest'
      '401':
        $ref: '../openapi.yaml#/components/responses/Unauthenticated'
      '500':
        $ref: '../openapi.yaml#/components/responses/InternalError'
      '503':
        description: The database was not reachable. Retry; this is transient by construction.
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestID'
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Error'

Sessions:
  get:
    operationId: listDevices
    summary: List the devices signed in to this account
    tags: [Identity]
    security:
      - BearerAccessToken: []
    description: |
      The device sessions that can currently act as the account, most recently used first
      (SHIP-46).

      Exactly one entry has `current: true` — the device this request came from. A client should
      label it, and should confirm before revoking it, because revoking it signs this device
      out.

      ## What is not listed

      Sessions that have been revoked, and sessions whose refresh token has lapsed. Neither can
      act as the account, so offering them invites revoking something already dead and pads a
      list whose value is that an unrecognised row stands out. The rows still exist — a session
      ends by being marked, never by being deleted — and remain available to support.

      `last_seen_at` is the last time that device exchanged its refresh token, which happens at
      least every fifteen minutes of use. **Reading this list does not update it**: a read is
      not activity, and a display column that every read writes to stops meaning anything.

      ## Paging

      The response uses the standard collection envelope. `next_cursor` is always `null` and
      `has_more` is `true` only if the account holds more live sessions than the platform will
      return in one response — a state reachable by signing in repeatedly instead of refreshing,
      and one to raise with support rather than to page through.
    responses:
      '200':
        description: The caller's live device sessions.
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestID'
        content:
          application/json:
            schema:
              $ref: '#/DeviceList'
      '401':
        $ref: '../openapi.yaml#/components/responses/Unauthenticated'
      '500':
        $ref: '../openapi.yaml#/components/responses/InternalError'
      '503':
        description: The database was not reachable. Retry; this is transient by construction.
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestID'
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Error'

SessionByID:
  delete:
    operationId: revokeDevice
    summary: Sign one device out
    tags: [Identity]
    security:
      - BearerAccessToken: []
    description: |
      Ends one of the caller's device sessions, named by the `id` from
      `GET /v1/auth/sessions` (SHIP-46).

      The device's refresh token stops working immediately. Its access token keeps verifying
      until it expires, for the reason `/v1/auth/logout` gives — it is signed rather than
      looked up — so this takes effect fully within `expires_in` seconds.

      **`DELETE` describes what happens to your list, not to the row.** The session is marked
      revoked and kept: "signed out three weeks ago" is what makes a device list and an audit
      trail readable, and the spent tokens of an ended session still name it.

      **Revoking the current session is permitted** and is the same thing as signing out, so a
      client should confirm first. What differs is the reason recorded against the row, which
      is a support and audit distinction rather than a client-visible one.

      ## Failures

      A session belonging to somebody else answers `404`, exactly as one that never existed
      does — `identity_session_not_found`. Distinguishing them would turn this into a way of
      finding out which identifiers name real sessions.

      Revoking a session that is already revoked answers `204`. The caller asked for a state
      and the state holds; reporting a failure would make an honest retry look like a mistake.
    parameters:
      - name: id
        in: path
        required: true
        description: The device session identifier, from `GET /v1/auth/sessions`.
        schema:
          type: string
          format: uuid
        example: 0191f3c2-8a4d-7c31-9f52-3b7e1d4a6c88
      - $ref: '#/IdempotencyKey'
    responses:
      '204':
        description: The device is signed out. No body.
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestID'
      '400':
        $ref: '../openapi.yaml#/components/responses/BadRequest'
      '401':
        $ref: '../openapi.yaml#/components/responses/Unauthenticated'
      '404':
        description: |
          No such device session on this account — `identity_session_not_found`. One belonging
          to another account answers identically.
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestID'
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Error'
      '500':
        $ref: '../openapi.yaml#/components/responses/InternalError'
      '503':
        description: The database was not reachable. Retry; this is transient by construction.
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestID'
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Error'

VerifyEmail:
  post:
    operationId: verifyEmail
    summary: Confirm an email address
    tags: [Identity]
    description: |
      Consumes the token that was emailed at registration and marks the address verified
      (SHIP-33). The token is single-use and expires after 24 hours.

      Public, and it has to be: proving an address is a step before the caller has any session.
      The token in the body *is* the credential, and it was sent to the address being proved.

      ## Outcomes

      - `200` — the address is verified. The account is returned.
      - `identity_verification_token_expired` — the token was genuine and its day is up. Ask
        for another with `POST /v1/auth/resend-verify`.
      - `identity_verification_token_invalid` — everything else: unknown, already used,
        superseded by a resend, or issued for an address the account no longer has. These are
        deliberately not distinguished; telling somebody holding a guessed token which part of
        the guess was wrong is free help.

      **Presenting the same token twice answers `200`,** provided it was the token that
      verified the address and the address is still verified. That is somebody clicking a link
      twice, which is not an error.
    parameters:
      - $ref: '#/IdempotencyKey'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [token]
            additionalProperties: false
            properties:
              token:
                type: string
                description: The value from the verification message. 43 characters, base64url.
                example: 9qE2vT7bYw1sJk4pNc0aRlX8oZgHdM3uQiV6yB5tCfE
    responses:
      '200':
        description: The address is verified.
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestID'
        content:
          application/json:
            schema:
              $ref: '#/Account'
      '400':
        description: |
          The token is not usable — `identity_verification_token_invalid` or
          `identity_verification_token_expired`.
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestID'
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Error'
      '500':
        $ref: '../openapi.yaml#/components/responses/InternalError'
      '503':
        description: The database was not reachable. Retry; this is transient by construction.
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestID'
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Error'

ResendVerify:
  post:
    operationId: resendVerification
    summary: Send another email verification message
    tags: [Identity]
    description: |
      Issues a new verification token and sends it, retiring whatever the account was holding
      (SHIP-31, SHIP-33). The previous link stops working.

      ## This endpoint deliberately tells you nothing

      **The answer is always `202` with the same body**, whether the address belongs to an
      account, is already verified, was sent a message moments ago, or has never been seen —
      the same reasoning as `POST /v1/auth/request-otp`. `retry_after_seconds` is a fixed
      interval, not the true remaining cooldown.

      Registration is the deliberate exception to that rule: it *does* report a duplicate
      address, because there the caller is trying to create the account and saying nothing
      would leave somebody who mistyped their address on a success screen.

      ## Rate limits

      One message per minute and five per hour, per account. Exceeding either sends nothing and
      still answers `202`.
    parameters:
      - $ref: '#/IdempotencyKey'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [email]
            additionalProperties: false
            properties:
              email:
                type: string
                format: email
                example: alice@example.com
    responses:
      '202':
        description: |
          The request was accepted. Whether a message was sent is deliberately not stated.
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestID'
          Retry-After:
            description: The same value as `retry_after_seconds`, in the standard header.
            schema:
              type: integer
            example: 60
        content:
          application/json:
            schema:
              $ref: '#/Accepted'
      '400':
        $ref: '../openapi.yaml#/components/responses/BadRequest'
      '422':
        description: The address is not one this platform can send to.
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestID'
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Error'
      '500':
        $ref: '../openapi.yaml#/components/responses/InternalError'
      '503':
        description: The database was not reachable. Retry; this is transient by construction.
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestID'
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Error'

RequestOTP:
  post:
    operationId: requestOTP
    summary: Send a one-time code to a mobile number
    tags: [Identity]
    description: |
      Sends a six-digit verification code by SMS (SHIP-34). It expires in ten minutes.

      ## This endpoint deliberately tells you nothing

      **The answer is always `202` with the same body**, whether the number belongs to an
      account, has already been verified, was sent a code moments ago, or has never been seen.
      A different status for a known number would turn this into a way of asking "does this
      person have a Shipper account", answerable one number at a time by anybody. The only
      observable difference is whether a message arrives, which the caller can only see if they
      are holding the handset.

      `retry_after_seconds` is a **fixed** interval, not the true remaining cooldown — the true
      one would carry the same disclosure. Run the resend timer from it (SHIP-54).

      ## Rate limits

      Two, both applied per account: no more than one code per minute, and no more than five per
      hour. Exceeding either sends nothing and still answers `202`. A text message costs money
      and wakes a real handset, so an unbounded resend is a bill directed at whoever owns the
      number.

      ## Wrong guesses

      Five wrong codes retire the live one. `POST /v1/auth/verify-phone` then answers
      `identity_otp_invalid` until a new code is requested.
    parameters:
      - $ref: '#/IdempotencyKey'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/PhoneRequest'
    responses:
      '202':
        description: |
          The request was accepted. Whether a message was sent is deliberately not stated.
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestID'
          Retry-After:
            description: The same value as `retry_after_seconds`, in the standard header.
            schema:
              type: integer
            example: 60
        content:
          application/json:
            schema:
              $ref: '#/Accepted'
      '400':
        $ref: '../openapi.yaml#/components/responses/BadRequest'
      '422':
        description: The number is not a number this platform can send to.
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestID'
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Error'
      '500':
        $ref: '../openapi.yaml#/components/responses/InternalError'
      '503':
        description: The database was not reachable. Retry; this is transient by construction.
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestID'
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Error'

VerifyPhone:
  post:
    operationId: verifyPhone
    summary: Confirm a mobile number with a one-time code
    tags: [Identity]
    description: |
      Marks the number verified after a correct code (SHIP-36). The code is consumed, so it
      cannot be used again.

      ## One failure code, deliberately

      Wrong code, expired code, no outstanding code, five wrong guesses already used, or a
      number with no account at all: every one of them answers `identity_otp_invalid`. Six
      digits is a guessable space, so every distinction is information handed to whoever is
      guessing — including whether the number has an account at all.

      The remedy is the same in every case: `POST /v1/auth/request-otp` for a new code.

      ## Attempts

      Five wrong guesses retire the outstanding code. Nothing tells the caller how many are
      left; the answer is the same before and after.
    parameters:
      - $ref: '#/IdempotencyKey'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [phone, code]
            additionalProperties: false
            properties:
              phone:
                type: string
                description: The number the code was sent to, in any of the forms a person types it.
                example: '0412 345 678'
              code:
                type: string
                pattern: '^[0-9]{6}$'
                example: '408213'
    responses:
      '200':
        description: The number is verified.
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestID'
        content:
          application/json:
            schema:
              $ref: '#/Account'
      '400':
        description: The code is not usable — `identity_otp_invalid`.
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestID'
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Error'
      '422':
        description: The number or the code was missing or malformed.
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestID'
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Error'
      '500':
        $ref: '../openapi.yaml#/components/responses/InternalError'
      '503':
        description: The database was not reachable. Retry; this is transient by construction.
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestID'
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Error'

Refresh:
  post:
    operationId: refreshSession
    summary: Exchange a refresh token for a new pair
    tags: [Identity]
    description: |
      Returns a new access token and a new refresh token, and retires the one presented
      (SHIP-39, SHIP-40, SHIP-42).

      **The refresh token rotates on every use.** The token in the request stops working the
      moment this call succeeds, so a client must store the new one before it makes another
      request. There is no window in which both are valid.

      Public, and it has to be: the caller is the client whose access token has just expired,
      so requiring one would lock them out of the endpoint that replaces it.

      ## Presenting a spent token ends the session

      A refresh token presented a second time invalidates the **whole device session**, not just
      that token — including the token the device is legitimately holding. Either the client
      replayed it or somebody else has a copy, and the platform cannot tell those apart.

      A client that fires two refreshes at once will do this to itself. Reuse the same
      `Idempotency-Key` for a retry of the same refresh, and serialise concurrent calls so that
      only one is in flight (SHIP-50).

      ## Failures

      One code, `identity_refresh_token_invalid`, for every outcome: a token that was never
      issued, one already rotated away, one past its thirty-day expiry, a session that has been
      signed out or revoked, and an account that has been suspended. The remedy is the same in
      every case — sign in again — and distinguishing them would tell somebody holding a stolen
      token which part of it the platform recognised.

      **It answers `400`, not `401`.** The credential is in the request body rather than in the
      bearer header, and a `401` here is the one answer that can send a client interceptor that
      refreshes on `401` around the loop a second time.
    parameters:
      - $ref: '#/IdempotencyKey'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [refresh_token]
            additionalProperties: false
            properties:
              refresh_token:
                type: string
                description: The refresh token from the last sign-in or refresh. 43 characters, base64url.
                example: hV8pQ2mXk4tZ7nR1bY6wJ3sL0aD5cF9gE2iU8oT4xM7
    responses:
      '200':
        description: A new pair was issued and the token presented has been retired.
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestID'
        content:
          application/json:
            schema:
              $ref: '#/TokenPair'
      '400':
        description: |
          The refresh token is not usable — `identity_refresh_token_invalid`. If it was one this
          platform had already rotated away, the whole device session has now been revoked.
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestID'
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Error'
      '500':
        $ref: '../openapi.yaml#/components/responses/InternalError'
      '503':
        description: The database was not reachable. Retry; this is transient by construction.
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestID'
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Error'

# ---------------------------------------------------------------------------------------
# Shared pieces

TokenPair:
  type: object
  required: [access_token, expires_in, refresh_token, refresh_token_expires_in]
  additionalProperties: false
  description: |
    The credentials a client holds after signing in (SHIP-41) or refreshing (SHIP-42).

    **Lifetimes are counts of seconds, not instants.** A client comparing a timestamp against
    its own clock would refresh at the wrong moment on any handset whose clock is wrong, which
    on a phone that has been out of signal is not unusual. A duration needs no agreement about
    what time it is.

    There is no `token_type`: this platform issues one kind of bearer token and the
    `BearerAccessToken` security scheme describes it.
  properties:
    access_token:
      type: string
      description: |
        Send it as a bearer token, per the `BearerAccessToken` security scheme. Hold it in
        memory only — never in preferences, documents, logs or crash reports (Docs/07 §3).
      example: eyJhbGciOiJIUzI1NiIsImtpZCI6ImRldiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIwMTkxZjNjMi04YTRkLTdjMzEtOWY1Mi0zYjdlMWQ0YTZjODgifQ.signature
    expires_in:
      type: integer
      description: How long the access token lasts, in seconds.
      example: 900
    refresh_token:
      type: string
      description: |
        Opaque, and **it replaces the one you sent**. Store it in the iOS Keychain or the
        Android Keystore before making another request; the previous one is already dead, and
        presenting it again ends the session.
      example: hV8pQ2mXk4tZ7nR1bY6wJ3sL0aD5cF9gE2iU8oT4xM7
    refresh_token_expires_in:
      type: integer
      description: |
        How long the refresh token lasts, in seconds — thirty days. The window slides: every
        refresh issues a new token with a full lifetime, so it is inactivity that ends a
        session rather than time since sign-in.
      example: 2592000

RateLimited:
  description: |
    Too many failed attempts — `rate_limited` (SHIP-47). Carries `Retry-After` in seconds, which
    is the time until the allowance returns rather than the time until a window rolls over.
  headers:
    X-Request-Id:
      $ref: '../openapi.yaml#/components/headers/RequestID'
    Retry-After:
      description: Seconds to wait before trying again.
      schema:
        type: integer
      example: 24
  content:
    application/json:
      schema:
        $ref: '../openapi.yaml#/components/schemas/Error'

Device:
  type: object
  required: [id, device_label, created_at, last_seen_at, current]
  additionalProperties: false
  description: |
    One device signed in to the account, as its owner sees it in `GET /v1/auth/sessions`.

    What is here is what somebody deciding "is that me?" needs. There is no token material in any
    form, and no expiry: a session appears on the list because it has not lapsed.
  properties:
    id:
      type: string
      format: uuid
      description: Pass this to `DELETE /v1/auth/sessions/{id}` to sign the device out.
      example: 0191f3c2-8a4d-7c31-9f52-3b7e1d4a6c88
    device_label:
      type: string
      maxLength: 120
      description: |
        What was sent as `device_label` at sign-in. It is display text and authenticates
        nothing, so two entries may legitimately read the same.
      example: Nethmin's iPhone
    created_at:
      type: string
      format: date-time
      description: When this device signed in.
      example: '2026-08-11T04:11:52.418Z'
    last_seen_at:
      type: string
      format: date-time
      description: |
        When it last exchanged its refresh token, which happens at least every fifteen minutes
        of use. Reading the list does not move it.
      example: '2026-08-12T21:03:07.902Z'
    current:
      type: boolean
      description: |
        True for the device this request came from, and for exactly one entry. Revoking it
        signs this device out.
      example: true

DeviceList:
  type: object
  required: [data, next_cursor, has_more]
  additionalProperties: false
  description: |
    The standard collection envelope. `next_cursor` is always `null` here — see the operation
    description.
  properties:
    data:
      type: array
      items:
        $ref: '#/Device'
    next_cursor:
      type: string
      nullable: true
      description: Always `null` on this endpoint.
      example: null
    has_more:
      type: boolean
      description: |
        True only if the account holds more live sessions than one response will carry. There
        is no cursor to follow; revoke devices you do not recognise, or contact support.
      example: false

IdempotencyKey:
  name: Idempotency-Key
  in: header
  required: true
  description: |
    One value per action, reused for every retry of that action. The first request with a
    given key executes and its response is stored; later requests with the same key get that
    response back without the handler running again.

    A state-changing request without one is refused with `idempotency_key_required`.
  schema:
    type: string
    maxLength: 255
  example: 6f1b2c8a-0d54-4a7e-9d3a-1f2e3c4b5a60

Account:
  type: object
  required: [id, email, phone, role, status, email_verified, phone_verified, created_at]
  additionalProperties: false
  description: |
    An account, as its own owner sees it. Verification is reported as two booleans rather than
    as the timestamps the database holds: the client's question is which screen comes next, and
    "since when" is a support and audit question.
  properties:
    id:
      type: string
      format: uuid
      description: UUIDv7, so it sorts by creation time without leaking a sequence.
      example: 0191f3c2-8a4d-7c31-9f52-3b7e1d4a6c88
    email:
      type: string
      format: email
      example: alice@example.com
    phone:
      type: string
      description: E.164, as normalised on the way in.
      example: '+61412345678'
    role:
      type: string
      enum: [customer, provider]
      example: customer
    status:
      type: string
      enum: [active, restricted, suspended]
      description: |
        Whether the account may be used at all. This is **not** provider verification, which
        is a separate eligibility decision with five states of its own (Docs/04 §4).
      example: active
    email_verified:
      type: boolean
      example: false
    phone_verified:
      type: boolean
      example: false
    created_at:
      type: string
      format: date-time
      example: '2026-08-11T04:11:52.418Z'

PhoneRequest:
  type: object
  required: [phone]
  additionalProperties: false
  properties:
    phone:
      type: string
      description: |
        An Australian mobile number in any of the forms a person types it. It is normalised to
        E.164 before it is compared with the account, so `0412 345 678` and `+61412345678` are
        the same number.
      example: '0412 345 678'

Accepted:
  type: object
  required: [retry_after_seconds]
  additionalProperties: false
  description: |
    The answer from an endpoint that will not say whether it did anything. One shape and one
    status for every outcome — see the operation description.
  properties:
    retry_after_seconds:
      type: integer
      description: |
        How long to wait before asking again. A **fixed** value, not the true remaining
        cooldown: the true one would disclose that this contact detail has been used recently,
        which discloses that it belongs to an account.
      example: 60
