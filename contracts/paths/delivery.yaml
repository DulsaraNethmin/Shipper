# Delivery — putting a driver on an awarded job, and everything that follows it.
#
# The counterpart of cmd/api/routes_delivery.go. Docs/10 §8.1 keeps the two in step: a domain adds
# one route file and one fragment, and edits neither this file's siblings nor the middle of a shared
# document. The one shared line per path is its $ref in contracts/openapi.yaml.
#
# Response schemas are `additionalProperties: false` throughout. Docs/07 §6 requires *clients* to
# tolerate fields they do not recognise, which is a rule about client behaviour and not a licence for
# the contract to describe less than the service returns.
#
# # Two callers, two credentials, and they are never the same credential
#
# `AssignDriver` and `Milestones` are the awarded provider, holding an ordinary mobile access token
# (`BearerAccessToken`) and acting on their own work.
#
# `DriverJob` is the driver, holding the job-scoped link the provider forwarded
# (`BearerDriverToken`). The assigned driver never holds a session: their portal is
# link-authenticated (Docs/07 §3) and their token is a separate system with its own key material and
# its own audience, granting exactly one job (Docs/10 §5).
#
# **Neither credential works on the other's operations, and both directions answer `401`.** That is
# not a convention this document is describing — it is checked by the platform in both directions,
# demonstrated over HTTP by `scripts/verify/70-delivery.sh`, and it is why `AssignDriver` can hand a
# provider a credential (SHIP-107) without that credential being any use to them.
#
# # There is no field for whose job and none for who is assigning
#
# The job is named in the path and the caller is whoever the credential says they are — the platform
# checks that pair against the job's accepted bid, or, on the driver route, against the job inside
# the link. A `provider_id` in a request body would be an authorisation decision made from client
# input, which Docs/07 §3 puts on the platform.

AssignDriver:
  post:
    operationId: assignDriver
    summary: Put a driver on an awarded job
    tags: [Delivery]
    security:
      - BearerAccessToken: []
    description: |
      Names the driver carrying the job and moves the job to `driver_assigned` (SHIP-106).

      Only the provider whose bid the customer accepted may call it. A job awarded to somebody
      else, and a job that does not exist, answer `404` identically — which jobs a competitor won
      is commercial information they never published.

      ## Nominating somebody, or driving it yourself

      Docs/02 §1 has one status for both — "provider has nominated a driver or self-assigned" — and
      they are one request:

      ```json
      { "driver_name": "Sam Patel", "driver_mobile": "0412 345 678" }
      { "driver_name": "Ravi Chandra", "self": true }
      ```

      `self` fills the mobile from the number on your account, which the platform has verified.
      It does not fill in the name: no account carries one yet. Sending `self` *and* a
      `driver_mobile` is refused rather than resolved either way, because a self-assignment that
      quietly ignored the number supplied would send the driver's link somewhere unexpected.

      The number may be written the way a person writes it — `0412 345 678`, `+61 412 345 678` —
      and is stored in E.164. A number with no country code is read as Australian.

      ## The driver has no account, and this is where that becomes concrete

      What the platform holds about a driver is what you type here: a name and a mobile. There is
      nothing to look them up by and nothing to invite. Neither field can be edited afterwards —
      milestones and status history are attributed to this record, so changing the name would
      re-attribute work somebody else did.

      ## Assigning twice

      Nominating the *same* driver again succeeds, answers `200`, and writes nothing. Retrying with
      the same `Idempotency-Key` replays the original response; this covers the other case, where a
      phone lost its connection, was restarted, and generated a fresh key for the same intent.

      Nominating a *different* driver is refused with `delivery_driver_already_assigned`. Replacing
      a driver is a separate intent and is not yet built.

      ## Driver assigned is skippable, so this endpoint is optional

      Docs/02 §2 permits `awarded → en_route_to_pickup` directly, because a provider driving the job
      themselves has nobody to nominate. A provider who sets off without calling this cannot call it
      afterwards: there is no route back to `driver_assigned`, and the answer is
      `delivery_job_not_assignable`.
    parameters:
      - $ref: '#/JobID'
      - $ref: '#/IdempotencyKey'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/DriverNomination'
    responses:
      '201':
        description: |
          The driver is on the job and the job is now `driver_assigned`.
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestID'
        content:
          application/json:
            schema:
              $ref: '#/Assignment'
      '200':
        description: |
          This driver was already on this job. Nothing was written and the existing assignment is
          returned — the same shape as `201`, so a client that does not care which happened parses
          one type.
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestID'
        content:
          application/json:
            schema:
              $ref: '#/Assignment'
      '400':
        $ref: '../openapi.yaml#/components/responses/BadRequest'
      '401':
        $ref: '../openapi.yaml#/components/responses/Unauthenticated'
      '404':
        $ref: '../openapi.yaml#/components/responses/NotFound'
      '409':
        description: |
          Either the job has a different driver already (`delivery_driver_already_assigned`), or it
          is in no status a driver can be assigned from (`delivery_job_not_assignable`). Both are
          resolved by reloading the job: the two lead to different screens, which is why they are
          two codes rather than one.
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestID'
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Error'
      '422':
        description: |
          One or more fields were rejected (`validation_failed`). `error.details` carries one entry
          per field, with the JSON path the client sent.
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestID'
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Error'
      '500':
        $ref: '../openapi.yaml#/components/responses/InternalError'
      '503':
        description: |
          A dependency this request needs is not answering (`service_unavailable`).
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestID'
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Error'

# --- schemas ---------------------------------------------------------------------------------

DriverNomination:
  type: object
  additionalProperties: false
  required: [driver_name]
  description: |
    Who is driving. Unknown fields are refused, so a client typo fails loudly rather than being
    silently ignored.
  properties:
    driver_name:
      type: string
      minLength: 1
      maxLength: 120
      description: |
        The driver's name, as the customer and support will see it. Generous in length because a
        driver is frequently identified by a name and a company beside it.
      example: Sam Patel
    driver_mobile:
      type: string
      description: |
        How the driver is reached, and where their job link will be sent. Written however a person
        writes it — spaces, brackets and dashes are all accepted — and stored in E.164. A number
        with no country code is read as Australian.

        The bound is the standard's rather than ours: once normalised it must be a `+` and between
        eight and fifteen digits, the first of which is not a zero.

        Required unless `self` is true, and refused when it is.
      example: 0412 345 678
    self:
      type: boolean
      description: |
        You are driving the job yourself. The mobile is taken from your account; the name is not,
        because no account carries one yet.
      default: false
      example: false

Assignment:
  type: object
  additionalProperties: false
  required:
    [id, job_id, driver_name, driver_mobile, assigned_at, driver_token, driver_token_expires_at]
  description: |
    The driver on one job, and the link to give them.

    **The job's status is deliberately not here.** A successful response means the job is
    `driver_assigned` and nothing else; repeating the status would be a second copy of a vocabulary
    the jobs endpoints own.

    **This response carries a credential.** `driver_token` is the driver's whole access to the
    platform, so treat it as one: do not log it, do not put it in analytics, and hand it only to the
    driver it was minted for.
  properties:
    id:
      type: string
      format: uuid
      description: |
        The assignment's identifier. It is what a milestone recorded by this driver is attributed
        to, and what the job-scoped link is issued against.
      example: 0198f2c1-6b40-7a11-9c3e-2f9a4d51b7e0
    job_id:
      type: string
      format: uuid
      example: 0198f2c1-6b40-7a11-9c3e-2f9a4d51b7e1
    driver_name:
      type: string
      example: Sam Patel
    driver_mobile:
      type: string
      description: In E.164, whatever form it was submitted in.
      example: '+61412345678'
    assigned_at:
      type: string
      format: date-time
      description: When the driver was put on the job, on the platform's clock, in UTC.
      example: '2026-08-12T04:15:30.000Z'
    driver_token:
      type: string
      description: |
        The driver's job-scoped credential (SHIP-107). **Forward it to them — Shipper does not.**

        Shipper sends no SMS in the MVP, so this response is the only place a link comes from and
        you are the one who has to pass it on. It grants exactly this job: it names no account, no
        role and no session, and it cannot be exchanged for a mobile session in either direction.

        A signed JWT, and its contents are the platform's business rather than a client's. Do not
        decode it and do not branch on anything inside it — `driver_token_expires_at` is beside it
        precisely so that you never have to.

        Assigning the same driver again returns a **new** token and the previous one keeps working
        until it expires. Reissuing a link that invalidates the last one is a separate action and is
        not built yet.
      example: eyJhbGciOiJIUzI1NiIsImtpZCI6ImRyaXZlci0yMDI2LTA4IiwidHlwIjoiSldUIn0.…
    driver_token_expires_at:
      type: string
      format: date-time
      description: |
        When the link stops working, in UTC. Seven days after it was issued by default.

        There is nothing to refresh: the driver holds no other credential, so this is the whole life
        of their access. Show it to them, and reissue when it has passed.
      example: '2026-08-19T04:15:30.000Z'

# --- parameters ------------------------------------------------------------------------------

JobID:
  name: id
  in: path
  required: true
  description: The job's identifier.
  schema:
    type: string
    format: uuid
  example: 0198f2c1-6b40-7a11-9c3e-2f9a4d51b7e1

IdempotencyKey:
  name: Idempotency-Key
  in: header
  required: true
  description: |
    A client-generated value, one per action, reused for every retry of that action. Every
    state-changing request carries one and is refused without it (SHIP-15) — a phone that retries
    after a dropped connection must not end up with two drivers on one job.
  schema:
    type: string
    maxLength: 255
  example: 6c1f2ab4-6f2a-4f0c-8b0e-9a53c1f21b8d

Milestones:
  post:
    operationId: recordMilestone
    summary: Record a delivery milestone
    tags: [Delivery]
    security:
      - BearerAccessToken: []
    description: |
      Records what happened on a delivery — that the driver has set off, collected the goods, or
      begun the journey — and moves the job when the lifecycle has a transition for it (SHIP-111).

      Only the provider whose bid the customer accepted may call it. The customer of the job may
      not: they are shown milestones and confirm the delivery at the end, and neither of those is
      recording one. A job awarded to somebody else, a job that does not exist, and a job that is
      the caller's own to watch rather than to drive all answer `404` identically.

      ## The milestone and the job's status are not the same thing

      Four of the five milestone names match a job status and they are still two vocabularies. A
      milestone is a claim that somebody did something; it is kept whether or not it moves the job,
      and a delivery that runs to plan produces both. **The response does not echo the job's
      status** — read the job if you need it.

      `driver_assigned` is recorded by `POST /v1/jobs/{id}/driver` rather than here, and `delivered`
      needs proof, which cannot be captured yet — see the responses below.

      ## Two clocks, and you must send the first one when they differ

      ```json
      { "milestone": "picked_up" }
      { "milestone": "picked_up", "recorded_at": "2026-08-12T06:40:11Z" }
      ```

      `recorded_at` is **when you acted**, not when you sent this. A device that records a milestone
      in a yard with no signal and syncs an hour later must send the earlier time: it is what the
      customer is shown, and the platform does not correct it or refuse it for being implausible.
      Omitting it means "now", which is right only when you are online at the moment you record.

      The response carries both — `recorded_at` as you sent it, and `accepted_at` as the platform's
      own clock. They are what makes an offline delivery reconstructable afterwards, so a client
      that renders only `accepted_at` is showing a sync time as though it were a delivery event.

      ## Recording the same thing twice

      Two different requests, and they are answered differently.

      **A retry** reuses its `Idempotency-Key`. It answers `200` with the milestone the first
      attempt recorded, and records nothing further — whether the retry arrives a second later or a
      day later, because the guarantee is a unique index in the database rather than a cached
      response. Retry as often as a dropped connection requires.

      **A second recording** is a new action with a new key: a driver who reaches a pickup, finds
      nobody there, and sets off again records `en_route_to_pickup` twice. Both are kept. The job
      moves once, because after the first it is already there.

      Reusing one key for two *different* milestones is refused with `idempotency_key_reused`. One
      key per action.

      ## A milestone the job has moved past

      Refused for now with `delivery_milestone_not_permitted`. **Do not discard the update when you
      get it** — hold it and show it as pending. Docs/02 §3.1 requires a late milestone to be
      absorbed into the record rather than rejected, and the platform will do that shortly; a client
      that deletes the driver's work on this answer will lose real records when it stops being sent.
    parameters:
      - $ref: '#/JobID'
      - $ref: '#/IdempotencyKey'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/MilestoneRecording'
    responses:
      '201':
        description: |
          The milestone is recorded. The job has moved too, unless it was already where this
          milestone would have put it.
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestID'
        content:
          application/json:
            schema:
              $ref: '#/Milestone'
      '200':
        description: |
          This `Idempotency-Key` had already recorded this milestone. Nothing was written and the
          original is returned — the same shape as `201`, so a client that does not care which
          happened parses one type.
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestID'
        content:
          application/json:
            schema:
              $ref: '#/Milestone'
      '400':
        $ref: '../openapi.yaml#/components/responses/BadRequest'
      '401':
        $ref: '../openapi.yaml#/components/responses/Unauthenticated'
      '404':
        $ref: '../openapi.yaml#/components/responses/NotFound'
      '409':
        description: |
          One of four, and they lead to four different places:

          | `error.code` | What happened |
          |---|---|
          | `delivery_milestone_not_permitted` | The job has moved past this milestone, or has not reached where it makes sense. Keep the update — see above |
          | `delivery_proof_required` | `delivered` needs photo proof or a recorded exception, and capturing either is not built yet |
          | `idempotency_key_reused` | This key already recorded a *different* milestone on this job. Generate a new one |
          | `idempotency_request_in_progress` | An identical request is still being handled. Retry in a moment |
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestID'
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Error'
      '422':
        description: |
          One or more fields were rejected (`validation_failed`). `error.details` carries one entry
          per field, with the JSON path the client sent.
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestID'
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Error'
      '500':
        $ref: '../openapi.yaml#/components/responses/InternalError'
      '503':
        description: |
          A dependency this request needs is not answering (`service_unavailable`).
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestID'
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Error'

MilestoneRecording:
  type: object
  additionalProperties: false
  required: [milestone]
  description: |
    What you did, and when you did it. Unknown fields are refused, so a client typo fails loudly
    rather than being silently ignored.
  properties:
    milestone:
      type: string
      enum: [en_route_to_pickup, picked_up, in_transit, delivered]
      description: |
        Which milestone. `driver_assigned` is deliberately absent: a driver is put on a job through
        `POST /v1/jobs/{id}/driver`, which is a different act with a record of its own.

        `delivered` is accepted by the schema and refused by the platform until proof can be
        captured (SHIP-114 to SHIP-118). It is listed because it is a real milestone and the client
        that will send it is being built against this document.
      example: picked_up
    recorded_at:
      type: string
      format: date-time
      description: |
        RFC 3339, and **your** clock: the moment you acted, not the moment you sent this. Send it
        whenever the two differ, which is every milestone recorded out of signal. Omit it and the
        platform uses its own clock, which is correct only when you are online as you record.

        It is not bounded against the present. A device with a wrong clock still recorded something
        true about work that was done, and discarding the record would lose more than the wrong
        timestamp costs.
      example: '2026-08-12T06:40:11Z'
    reason:
      type: string
      maxLength: 500
      description: |
        Optional. What a person should know about this milestone that the milestone itself does not
        say — "nobody at the gate, returning at four". It is kept with the record and shown to
        support.
      example: nobody at the gate, returning at four

Milestone:
  type: object
  additionalProperties: false
  required: [id, job_id, milestone, recorded_by, recorded_at, accepted_at]
  description: |
    One recorded milestone.

    **The job's status is not here.** A milestone may deliberately move nothing — a second
    `en_route_to_pickup` after a failed pickup attempt is kept and moves the job nowhere — so a
    client that read a status from this response would be reading something it does not say.
  properties:
    id:
      type: string
      format: uuid
      example: 0198f2c1-6b40-7a11-9c3e-2f9a4d51b7e2
    job_id:
      type: string
      format: uuid
      example: 0198f2c1-6b40-7a11-9c3e-2f9a4d51b7e1
    milestone:
      type: string
      enum: [driver_assigned, en_route_to_pickup, picked_up, in_transit, delivered]
      example: picked_up
    recorded_by:
      type: string
      enum: [provider, driver, admin, system]
      description: |
        What kind of actor recorded it, not who they are. It is `provider` for everything recorded
        through this endpoint today; the other three arrive with the driver portal, administrative
        action, and the automatic `picked_up → in_transit` presentation change.
      example: provider
    reason:
      type: string
      description: Present only when one was given.
      example: nobody at the gate, returning at four
    recorded_at:
      type: string
      format: date-time
      description: |
        When the actor says they acted, in UTC. **This is what a customer is shown.** It is what was
        sent, uncorrected.
      example: '2026-08-12T06:40:11.000Z'
    accepted_at:
      type: string
      format: date-time
      description: |
        When the platform received it, in UTC, on the platform's clock. This is what audit and
        support reason about, and it is later than `recorded_at` by however long the device was out
        of signal.
      example: '2026-08-12T09:15:02.481Z'

# --- the driver's own surface -----------------------------------------------------------------

DriverJob:
  get:
    operationId: driverJob
    summary: Open the delivery a driver's link grants
    tags: [Delivery]
    security:
      - BearerDriverToken: []
    description: |
      The delivery behind a driver's job-scoped link (SHIP-108). It is the first operation in the
      service authenticated by something other than a mobile session, and the only one a driver can
      reach at all.

      ## The link grants this job and nothing else

      The token names one job, inside its signature. Presenting it on any other job answers `404` —
      the same answer a job that does not exist gives, because telling the two apart would confirm
      that somebody else's delivery exists. The platform compares the job in the path with the job
      in the token before this operation runs, so there is no request shape that widens the grant.

      The `id` in the path is therefore redundant with the token and deliberately so: it is what
      makes "exactly one job" checkable from outside, and it is what lets a driver carrying two
      deliveries hold two links their browser can tell apart.

      ## What it does not return, yet

      The addresses, the goods and who to call are **not** here. That is the driver portal's job
      view and it is built separately; this answers which job the link opens, which assignment it
      belongs to, and how long it lasts. Fields will be added to this shape rather than moved to
      another operation.

      The driver's mobile is deliberately absent, unlike the provider's view of the same
      assignment: a link travels through whatever channel the provider already uses, so it can be
      forwarded again, and whoever ends up holding it should learn as little as possible.

      ## Nothing here can be exchanged for a session

      This token names no account, no role and no session, so there is nothing to sign in as. A
      mobile access token presented here answers `401`, and this token presented on any
      `BearerAccessToken` operation answers `401`. Neither direction is a special case in a
      handler; both are what the audience check does.
    parameters:
      - $ref: '#/JobID'
    responses:
      '200':
        description: |
          The assignment this link grants.
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestID'
        content:
          application/json:
            schema:
              $ref: '#/DriverAssignment'
      '401':
        description: |
          The link was missing, unreadable, or has run out.

          | `error.code` | What happened |
          |---|---|
          | `unauthenticated` | No link was presented, or the one presented is not valid here. Which check refused it is deliberately not said — it is information only somebody probing has a use for, and a mobile access token presented here is one of the cases |
          | `delivery_driver_link_expired` | The link was genuine and its window has closed. **There is nothing to refresh** — a driver holds no second credential — so ask the transport provider to send a new one |
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestID'
          WWW-Authenticate:
            description: The authentication scheme this endpoint accepts.
            schema:
              type: string
            example: Bearer error="invalid_token"
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Error'
      '404':
        description: |
          This link does not open this job (`not_found`) — either it grants a different one, or the
          assignment behind it is no longer the live one on the job. Both answer exactly what a job
          that does not exist answers.
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestID'
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Error'
      '500':
        $ref: '../openapi.yaml#/components/responses/InternalError'
      '503':
        description: |
          A dependency this request needs is not answering (`service_unavailable`).
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestID'
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Error'

DriverAssignment:
  type: object
  additionalProperties: false
  required: [job_id, assignment_id, driver_name, assigned_at, link_expires_at]
  description: |
    What a driver's link opens: the one job it grants and the assignment it belongs to.

    Smaller than the provider's view of the same row on purpose — see the operation above.
  properties:
    job_id:
      type: string
      format: uuid
      description: The one job this link grants. It is the same value that is in the path.
      example: 0198f2c1-6b40-7a11-9c3e-2f9a4d51b7e1
    assignment_id:
      type: string
      format: uuid
      description: |
        The assignment this link belongs to. A driver has no account, so this record is their
        identity for the length of one job, and it is what their milestones are attributed to.
      example: 0198f2c1-6b40-7a11-9c3e-2f9a4d51b7e0
    driver_name:
      type: string
      description: |
        The name the transport provider wrote down. It is here so a driver carrying more than one
        job can tell that this link is theirs.
      example: Sam Patel
    assigned_at:
      type: string
      format: date-time
      description: When the driver was put on the job, on the platform's clock, in UTC.
      example: '2026-08-12T04:15:30.000Z'
    link_expires_at:
      type: string
      format: date-time
      description: |
        When this link stops working, in UTC — the same instant the transport provider was shown
        when they created the assignment.

        It is returned rather than left to be decoded out of the credential, which is a thing a
        client should never do.
      example: '2026-08-19T04:15:30.000Z'
